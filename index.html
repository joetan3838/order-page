<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5K Wholesale Self-Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-dark: #081726;
      --navy-main: #0F2537;
      --navy-light: #1B3B56;
      --gold-primary: #C59B47;
      --gold-bright: #E5C168;
      --gold-light: #EAD296;
      --gold-border: #D8C292;
      --bg-outer: #DCE1E7;
      --bg-app: #F8F6F0;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --stock-green: #16A34A;
      --stock-red: #DC2626;
      --copy-border: #7BA7E1;
      --wa-green: #25D366;
      --wa-green-dark: #1DA851;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-outer);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-variant-numeric: tabular-nums;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg-app);
      box-shadow: 0 0 36px rgba(8, 23, 38, 0.18);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 148px;
    }

    /* 顶部深海蓝金边栏 */
    .top-header {
      background: linear-gradient(180deg, var(--navy-dark) 0%, var(--navy-main) 100%);
      padding: 16px 16px 20px;
      color: #FFFFFF;
      border-bottom: 2.5px solid var(--gold-primary);
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      box-shadow: 0 6px 18px rgba(11, 29, 46, 0.18);
    }

    .top-bar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .admin-entry-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(216, 194, 146, 0.35);
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .admin-entry-btn.active-mode {
      background: var(--gold-primary);
      color: var(--navy-dark);
      border-color: #FFF3C4;
    }

    .lang-pill {
      background-color: #FFFFFF;
      border-radius: 999px;
      padding: 3px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--navy-main);
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .lang-btn.active {
      background-color: var(--navy-main);
      color: #FFFFFF;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* 强化立体厚度的 3D 金属徽标 */
    .logo-emblem {
      width: 74px;
      height: 74px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.65));
      cursor: pointer;
      user-select: none;
    }

    .logo-emblem svg {
      width: 74px;
      height: 74px;
      display: block;
    }

    .brand-title h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.16;
      letter-spacing: -0.4px;
      color: #FFFFFF;
    }

    .brand-title p {
      font-size: 12.5px;
      color: var(--gold-light);
      margin-top: 4px;
      font-weight: 600;
    }

    /* 主内容区 */
    .main-content {
      padding: 16px;
      flex: 1;
    }

    .search-box {
      position: relative;
      margin-bottom: 16px;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-primary);
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      background-color: #FFFFFF;
      border: 1.5px solid var(--gold-border);
      border-radius: 999px;
      padding: 11px 16px 11px 40px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-main);
      outline: none;
      box-shadow: 0 3px 10px rgba(15, 37, 55, 0.05);
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--gold-primary);
    }

    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    .nav-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .section-heading {
      font-size: 17px;
      font-weight: 800;
      color: var(--navy-main);
      margin-top: 2px;
      letter-spacing: -0.2px;
    }

    .main-menu-btn {
      background-color: var(--navy-main);
      border: 1.5px solid var(--gold-primary);
      color: var(--gold-bright);
      font-size: 12px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(15, 37, 55, 0.14);
      white-space: nowrap;
    }

    .main-menu-btn:active {
      transform: scale(0.97);
    }

    .back-btn {
      background-color: #FFFFFF;
      border: 1.5px solid var(--gold-border);
      color: var(--navy-main);
      font-size: 12px;
      font-weight: 800;
      padding: 6px 11px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
      white-space: nowrap;
    }

    .back-btn:active {
      transform: scale(0.97);
    }

    /* 金边立体卡片 */
    .gold-card {
      background-color: var(--card-bg);
      border: 1.5px solid var(--gold-border);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 11px;
      box-shadow: 0 4px 12px rgba(15, 37, 55, 0.05);
      transition: transform 0.12s ease, border-color 0.2s;
    }

    .gold-card.clickable {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .gold-card.clickable:active {
      transform: scale(0.985);
      border-color: var(--gold-primary);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cat-badge {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(145deg, #16334D 0%, #0B1D2E 100%);
      border: 1.2px solid var(--gold-primary);
      color: var(--gold-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13.5px;
      flex-shrink: 0;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.18);
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--navy-main);
      margin-bottom: 2px;
      letter-spacing: -0.2px;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .chevron {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #FAF6EE;
      border: 1px solid var(--gold-border);
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
    }

    .rma-card {
      border: 1.5px dashed var(--gold-primary);
      background: linear-gradient(180deg, #FFFFFF 0%, #FAF7EF 100%);
    }

    /* 商品卡片与加购区 */
    .product-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .product-card.sold-out {
      opacity: 0.62;
      background-color: #F1F5F9;
      border-color: #CBD5E1;
    }

    .stock-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 2.5px 8px;
      border-radius: 999px;
      margin-top: 6px;
      letter-spacing: 0.4px;
    }

    .stock-badge.in {
      background-color: #DCFCE7;
      color: #15803D;
      border: 1px solid #86EFAC;
    }

    .stock-badge.out {
      background-color: #FEE2E2;
      color: #B91C1C;
      border: 1px solid #FCA5A5;
    }

    .qty-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .bulk-btns {
      display: flex;
      gap: 5px;
    }

    .bulk-btn {
      background-color: var(--navy-main);
      color: #FFFFFF;
      border: 1px solid var(--gold-primary);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      cursor: pointer;
    }

    .step-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-btn {
      width: 27px;
      height: 27px;
      border-radius: 7px;
      border: 1px solid var(--gold-border);
      background-color: #FAF6EE;
      color: var(--navy-main);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .qty-num {
      font-size: 15px;
      font-weight: 800;
      min-width: 22px;
      text-align: center;
    }

    .disabled-controls button {
      background-color: #E2E8F0 !important;
      border-color: #CBD5E1 !important;
      color: #94A3B8 !important;
      cursor: not-allowed;
    }

    /* 底部双层固定区：上方 Total Up 总结栏 + 下方结算栏 */
    .bottom-dock {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .total-up-bar {
      background: linear-gradient(90deg, #FDF8EB 0%, #F5E6C4 100%);
      border-top: 2px solid var(--gold-primary);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 -4px 14px rgba(15, 37, 55, 0.12);
    }

    .total-up-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      color: var(--navy-main);
    }

    .total-up-btn-pill {
      background-color: var(--navy-main);
      color: var(--gold-bright);
      border: 1px solid var(--gold-primary);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 11.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .bottom-bar {
      background: linear-gradient(180deg, var(--navy-main) 0%, var(--navy-dark) 100%);
      border-top: 1.5px solid rgba(197, 155, 71, 0.55);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .inv-meta-box {
      cursor: pointer;
      min-width: 0;
    }

    .date-line {
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inv-line {
      color: var(--gold-light);
      font-size: 12.5px;
      font-weight: 700;
      margin-top: 2px;
      letter-spacing: 0.4px;
    }

    .action-btns {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .copy-order-btn {
      background: linear-gradient(180deg, #234575 0%, #162E52 100%);
      color: #FFFFFF;
      border: 1.5px solid var(--copy-border);
      border-radius: 11px;
      padding: 7px 11px;
      font-size: 11.5px;
      font-weight: 800;
      line-height: 1.15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      min-width: 68px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
      transition: transform 0.12s;
    }

    .copy-order-btn svg {
      width: 17px;
      height: 17px;
      stroke: #93C5FD;
    }

    .copy-order-btn:active {
      transform: scale(0.96);
    }

    .wa-order-btn {
      background: linear-gradient(180deg, var(--wa-green) 0%, var(--wa-green-dark) 100%);
      color: #FFFFFF;
      border: 1.5px solid #6EE7B7;
      border-radius: 11px;
      padding: 7px 13px;
      font-size: 11.5px;
      font-weight: 800;
      line-height: 1.15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      min-width: 108px;
      box-shadow: 0 3px 10px rgba(29, 168, 81, 0.35);
      transition: transform 0.12s;
    }

    .wa-order-btn svg {
      width: 18px;
      height: 18px;
      fill: #FFFFFF;
    }

    .wa-order-btn:active {
      transform: scale(0.96);
    }

    /* 表单、拍照与保修图片缩略图样式 */
    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--navy-main);
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--gold-border);
      border-radius: 10px;
      font-size: 13.5px;
      background-color: #FFFFFF;
      color: var(--text-main);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--gold-primary);
    }

    .photo-capture-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .camera-btn {
      background-color: var(--navy-main);
      color: var(--gold-bright);
      border: 1.5px solid var(--gold-primary);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .gallery-btn {
      background-color: #FAF6EE;
      color: var(--navy-main);
      border: 1.5px solid var(--gold-border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .photo-thumb-card {
      position: relative;
      border: 1.5px solid var(--gold-border);
      border-radius: 10px;
      overflow: hidden;
      background: #0F172A;
    }

    .photo-thumb-card img {
      width: 100%;
      height: 82px;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    .photo-thumb-actions {
      display: flex;
      justify-content: space-between;
      background: #FFFFFF;
      padding: 4px 6px;
      font-size: 10.5px;
      font-weight: 800;
    }

    .photo-act-link {
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: 800;
      font-size: 10.5px;
    }

    .claim-id-banner {
      background: linear-gradient(135deg, var(--navy-main) 0%, var(--navy-light) 100%);
      color: #FFFFFF;
      border: 1.5px solid var(--gold-primary);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .claim-btn-row {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 8px;
      margin-top: 12px;
    }

    .claim-btn-row .copy-order-btn,
    .claim-btn-row .wa-order-btn {
      flex-direction: row;
      padding: 11px 12px;
      font-size: 12.5px;
      gap: 7px;
      width: 100%;
    }

    /* Admin 一步到位后台样式 */
    .admin-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .admin-tab-btn {
      padding: 10px;
      border-radius: 10px;
      border: 1.5px solid var(--gold-border);
      background-color: #FFFFFF;
      color: var(--navy-main);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .admin-tab-btn.active {
      background-color: var(--navy-main);
      color: var(--gold-bright);
      border-color: var(--gold-primary);
    }

    .instant-toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid #F1F5F9;
      gap: 10px;
    }

    .instant-toggle-row:last-child {
      border-bottom: none;
    }

    .one-click-pill {
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      min-width: 98px;
      text-align: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .one-click-pill.on {
      background-color: var(--stock-green);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
    }

    .one-click-pill.off {
      background-color: var(--stock-red);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(220, 38, 38, 0.3);
    }

    .claim-record-card {
      background-color: #FFFFFF;
      border: 1.5px solid var(--gold-border);
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .claim-record-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .badge-navy {
      background-color: var(--navy-main);
      color: var(--gold-bright);
    }

    .badge-inv {
      background-color: #EFF6FF;
      color: #1D4ED8;
      border: 1px solid #BFDBFE;
    }

    .badge-no-inv {
      background-color: #F8FAFC;
      color: #475569;
      border: 1px solid #CBD5E1;
    }

    .status-cycle-btn {
      border: none;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .status-pending {
      background-color: #FEF3C7;
      color: #B45309;
      border: 1px solid #FCD34D;
    }

    .status-done {
      background-color: #DCFCE7;
      color: #15803D;
      border: 1px solid #86EFAC;
    }

    .status-rejected {
      background-color: #FEE2E2;
      color: #B91C1C;
      border: 1px solid #FCA5A5;
    }

    /* 弹窗与总单明细行 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 23, 38, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 250;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 2px solid var(--gold-primary);
      border-radius: 16px;
      padding: 16px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38);
    }

    .summary-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #F1F5F9;
      gap: 8px;
    }

    .summary-grand-box {
      background: linear-gradient(135deg, var(--navy-main) 0%, var(--navy-light) 100%);
      color: #FFFFFF;
      border: 1.5px solid var(--gold-primary);
      border-radius: 11px;
      padding: 11px 14px;
      margin: 12px 0;

      if (typeof savedCatWarranty[cat.id] === 'boolean') {
        cat.warrantyEnabled = savedCatWarranty[cat.id];
      }
      cat.brands.forEach(b => {
        b.products.forEach(p => {
          if (typeof savedStock[p.id] === 'boolean') {
            p.inStock = savedStock[p.id];
          }
        });
      });
    });
    return cloned;
  }

  function persistStockAndWarranty() {
    const stockMap = {};
    const catWarranty = {};
    catalogData.forEach(cat => {
      catWarranty[cat.id] = cat.warrantyEnabled;
      cat.brands.forEach(b => {
        b.products.forEach(p => {
          stockMap[p.id] = p.inStock;
        });
      });
    });
    localStorage.setItem('5k_stock_map', JSON.stringify(stockMap));
    localStorage.setItem('5k_cat_warranty', JSON.stringify(catWarranty));
    localStorage.setItem('5k_rma_global', JSON.stringify(rmaGlobalEnabled));

    return `${dd}/${mm}/${yyyy}`;

    return 'INV-' + String(num).padStart(6, '0');
  }

  function formatClaimId(num) {
    return 'CLAIM-' + String(num).padStart(5, '0');
  }

  function getActiveDisplayInvoiceId() {
    const sig = getCartSignature();
    if (committedOrderInv && sig && sig === committedCartSignature) {
      return committedOrderInv;

    return formatInvoiceId(nextInvNum);
  }

  function getCartSignature() {
    const keys = Object.keys(cart).sort();
    if (keys.length === 0) return '';
    return keys.map(k => `${k}:${cart[k].qty}`).join('|');
  }

  async function copyTextToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  }

  function findProductById(prodId) {
    for (const cat of catalogData) {
      for (const brand of cat.brands) {
        const found = brand.products.find(p => p.id === prodId);
        if (found) return { product: found, brand, category: cat };
      }
    }
    return null;
  }

  function changeQty(prodId, delta) {
    const info = findProductById(prodId);
    if (!info || !info.product.inStock) return;

    const current = cart[prodId] ? cart[prodId].qty : 0;
    const next = Math.max(0, current + delta);
    if (next === 0) {
      delete cart[prodId];
    } else {
      cart[prodId] = {
        id: prodId,
        name: info.product.name,
        brand: info.brand.name,
        qty: next
      };
    }
    if (getCartSignature() !== committedCartSignature) {
      committedOrderInv = null;
    }
    updateBottomBar();
    updateCartModalIfOpen();
    renderView();
  }

    const items = Object.values(cart);

  }

  function commitOrderRecord() {
    const sig = getCartSignature();
    if (committedOrderInv && sig === committedCartSignature) {
      return committedOrderInv;
    }
    const assignedInv = formatInvoiceId(nextInvNum);
    const itemsSnapshot = Object.values(cart).map(i => ({ ...i }));
    orderHistory.unshift({
      invId: assignedInv,
      date: getTodayFormatted(),
      items: itemsSnapshot,
      totalQty: itemsSnapshot.reduce((s, x) => s + x.qty, 0)
    });
    localStorage.setItem('5k_orders', JSON.stringify(orderHistory));

    nextInvNum += 1;
    localStorage.setItem('5k_next_inv', String(nextInvNum));

    committedOrderInv = assignedInv;
    committedCartSignature = sig;
    updateBottomBar();
    return assignedInv;
  }

  /* ================= 保修拍照压缩、保存图片与预览 ================= */
  function compressImageFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 860;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          // 右下角自动打上日期水印便于核对保修证据
          const stamp = `5K WARRANTY · ${getTodayFormatted()}`;
          ctx.fillStyle = 'rgba(8, 23, 38, 0.68)';
          ctx.fillRect(w - 220, h - 28, 212, 22);
          ctx.fillStyle = '#EAD296';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText(stamp, w - 212, h - 13);

          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ================= 保修申请 (CLAIM-00001) 逻辑 ================= */
  function autoFillInvoiceItems(invInputVal) {
    const clean = invInputVal.trim().toUpperCase();
    const hintBox = document.getElementById('inv-match-hint');
    if (!hintBox) return;
    if (!clean) {
      hintBox.innerHTML = `<span style="color:var(--text-muted);">No Invoice entered — will be saved directly under <b>${formatClaimId(nextClaimNum)}</b> as standalone warranty proof.</span>`;
      return;
    }
    const matchedOrder = orderHistory.find(o => o.invId.toUpperCase() === clean);
    const existingClaims = claimHistory.filter(c => c.invId && c.invId.toUpperCase() === clean);
    if (matchedOrder) {
      const itemsStr = matchedOrder.items.map(i => `[${i.brand}] ${i.name} x${i.qty}`).join(', ');
      const claimWarn = existingClaims.length > 0
        ? `<div style="color:#B45309;margin-top:3px;">⚠️ Existing Claim(s) on this Invoice: ${existingClaims.map(c => c.claimId).join(', ')}</div>`
        : `<div style="color:var(--stock-green);margin-top:3px;">✓ Verified Order (${matchedOrder.date}) · No prior claim</div>`;
      hintBox.innerHTML = `<div style="background:#F0FDF4;border:1px solid #BBF7D0;padding:8px 10px;border-radius:8px;margin-top:6px;font-size:11.5px;"><b>Order Items:</b> ${itemsStr}${claimWarn}</div>`;
    } else {
      hintBox.innerHTML = `<span style="color:var(--navy-light);font-size:11.5px;">Invoice <b>${clean}</b> will be linked to <b>${formatClaimId(nextClaimNum)}</b>.</span>`;
    }
  }

    const itemsVal = (document.getElementById('rma-items-input')?.value || '').trim();
    const reasonVal = (document.getElementById('rma-reason-input')?.value || '').trim();

    if (!itemsVal) {
      alert(currentLang === 'zh' ? '请填写需要保修的单品名称与数量' : 'Please enter the warranty item(s) and quantity.');
      return null;
    }

    const claimId = formatClaimId(nextClaimNum);
    const record = {
      claimId,
      invId: invVal,
      date: getTodayFormatted(),
      category: catVal,
      items: itemsVal,
      reason: reasonVal || 'Warranty / Defective Return',
      photos: [...pendingRmaPhotos],

    };

    claimHistory.unshift(record);
    safeSaveClaims();

    localStorage.setItem('5k_next_claim', String(nextClaimNum));
    pendingRmaPhotos = [];

    return `${rec.date}\n${rec.claimId}\n${invLine}\nCategory: ${rec.category}\nItems: ${rec.items}\nIssue: ${rec.reason}${photoLine}`;

      category: 'Staff Logged',
      items: itemsVal,
      reason: reasonVal || 'Staff Warranty Proof',
      photos: [...pendingStaffPhotos],
      status: 'done'
    });
    safeSaveClaims();
    nextClaimNum += 1;
    localStorage.setItem('5k_next_claim', String(nextClaimNum));
    pendingStaffPhotos = [];
    showToast(`Saved under ${claimId}!`);
    renderView();
  }

  /* ================= 视图渲染引擎 ================= */
  function renderView() {
    const container = document.getElementById('app-view');
    const t = i18n[currentLang];
    let html = '';

    /* -------- 1. 后台一步到位管理视图 -------- */
    if (viewState === 'admin') {
      html += `
        <div class="admin-tabs">
          <button class="admin-tab-btn ${adminTab === 'stock' ? 'active' : ''}" onclick="switchAdminTab('stock')">📦 Stock Switch</button>
          <button class="admin-tab-btn ${adminTab === 'claims' ? 'active' : ''}" onclick="switchAdminTab('claims')">🛡️ Claims & Invoices</button>
        </div>
      `;

      if (adminTab === 'stock') {
        html += `<div class="gold-card"><div class="section-label" style="margin-bottom:8px;">ONE-CLICK INSTANT STOCK LEVEL</div>`;
        let count = 0;
        catalogData.forEach(cat => {
          cat.brands.forEach(brand => {
            brand.products.forEach(prod => {
              const match = !searchQuery ||
                prod.name.toLowerCase().includes(searchQuery) ||
                brand.name.toLowerCase().includes(searchQuery) ||
                cat.title.en.toLowerCase().includes(searchQuery);
              if (!match) return;
              count++;
              html += `
                <div class="instant-toggle-row">
                  <div>
                    <div style="font-size:11px;font-weight:800;color:var(--gold-primary);">[${brand.name}] · ${cat.badge}</div>
                    <div style="font-size:14px;font-weight:800;color:var(--navy-main);">${prod.name}</div>
                    <div class="card-desc">${prod.spec}</div>
                  </div>
                  <button class="one-click-pill ${prod.inStock ? 'on' : 'off'}" onclick="instantToggleStock('${prod.id}')">
                    ${prod.inStock ? 'IN STOCK' : 'SOLD OUT'}
                  </button>
                </div>
              `;
            });
          });
        });
        if (count === 0) {
          html += `<div class="card-desc" style="padding:10px 0;">No matching products found.</div>`;
        }
        html += `</div>`;
      } else {
        html += `
          <div class="gold-card">
            <div class="section-label" style="margin-bottom:8px;">WARRANTY (RMA) INSTANT SWITCHES</div>
            <div class="instant-toggle-row">
              <div>
                <div style="font-size:14px;font-weight:800;color:var(--navy-main);">Homepage RMA Entry</div>
                <div class="card-desc">Show or hide Return / Warranty card on home</div>
              </div>
              <button class="one-click-pill ${rmaGlobalEnabled ? 'on' : 'off'}" onclick="instantToggleGlobalRma()">
                ${rmaGlobalEnabled ? 'ON' : 'OFF'}
              </button>
            </div>
            ${catalogData.map(cat => `
              <div class="instant-toggle-row">
                <div>
                  <div style="font-size:13.5px;font-weight:700;color:var(--navy-main);">${cat.title.en}</div>
                  <div class="card-desc">Allow warranty claims for this category</div>
                </div>
                <button class="one-click-pill ${cat.warrantyEnabled ? 'on' : 'off'}" onclick="instantToggleCategoryWarranty('${cat.id}')">
                  ${cat.warrantyEnabled ? 'ENABLED' : 'DISABLED'}
                </button>
              </div>
            `).join('')}
          </div>

          <div class="gold-card">
            <div class="section-label" style="margin-bottom:6px;">QUICK STAFF CLAIM PROOF (${formatClaimId(nextClaimNum)})</div>
            <div class="card-desc" style="margin-bottom:10px;">Link an Invoice ID, or leave blank to track purely by <b>${formatClaimId(nextClaimNum)}</b></div>
            <input type="text" id="staff-claim-inv" class="form-control" placeholder="Invoice No (e.g. INV-000051 or leave empty)" style="margin-bottom:8px;">
            <input type="text" id="staff-claim-items" class="form-control" placeholder="Items & Qty (e.g. PRO POD BLACK x 2)" style="margin-bottom:8px;">
            <input type="text" id="staff-claim-reason" class="form-control" placeholder="Note / Evidence (e.g. Auto-firing / Leaking)" style="margin-bottom:8px;">

            <input type="file" id="staff-cam-input" accept="image/*" capture="environment" style="display:none;" onchange="handlePhotoInput(this.files, 'staff')">
            <input type="file" id="staff-gal-input" accept="image/*" multiple style="display:none;" onchange="handlePhotoInput(this.files, 'staff')">
            <div class="photo-capture-row" style="margin-bottom:8px;">
              <button type="button" class="camera-btn" onclick="document.getElementById('staff-cam-input').click()">📷 Take Photo</button>
              <button type="button" class="gallery-btn" onclick="document.getElementById('staff-gal-input').click()">🖼️ Gallery</button>
            </div>
            <div id="staff-photo-grid" class="photo-grid" style="margin-bottom:10px;"></div>

            <button class="back-btn" style="width:100%;justify-content:center;background:var(--navy-main);color:var(--gold-bright);border-color:var(--gold-primary);padding:10px;" onclick="quickStaffLogClaim()">
              + Save Warranty Proof (${formatClaimId(nextClaimNum)})
            </button>
          </div>

          <div class="nav-header" style="margin-top:16px;">
            <div>
              <div class="section-label">CLAIM EVIDENCE LOG</div>
              <div class="section-heading">Warranty Records (${claimHistory.length})</div>
            </div>
          </div>
        `;

        const filteredClaims = claimHistory.filter(c =>
          !searchQuery ||
          c.claimId.toLowerCase().includes(searchQuery) ||
          (c.invId && c.invId.toLowerCase().includes(searchQuery)) ||
          c.items.toLowerCase().includes(searchQuery)
        );

        if (filteredClaims.length === 0) {
          html += `<div class="gold-card"><div class="card-desc">No warranty claims recorded yet. Next ID: <b>${formatClaimId(nextClaimNum)}</b></div></div>`;
        } else {
          filteredClaims.forEach(c => {
            const stClass = c.status === 'done' ? 'status-done' : c.status === 'rejected' ? 'status-rejected' : 'status-pending';
            const stText = c.status === 'done' ? '✓ CLAIM DONE' : c.status === 'rejected' ? '✕ REJECTED' : '⏳ PENDING';
            const photoGridHtml = (c.photos && c.photos.length > 0)
              ? `<div class="photo-grid">${c.photos.map((p, idx) => `
                  <div class="photo-thumb-card">
                    <img src="${p}" alt="Claim Photo" onclick="openSavedClaimPhoto('${c.claimId}', ${idx})">
                    <div class="photo-thumb-actions">
                      <button type="button" class="photo-act-link" style="color:var(--navy-main);" onclick="openSavedClaimPhoto('${c.claimId}', ${idx})">🔍 View / Save</button>
                    </div>
                  </div>
                `).join('')}</div>`
              : '';
            html += `
              <div class="claim-record-card">
                <div class="claim-record-top">
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    <span class="badge-tag badge-navy">${c.claimId}</span>
                    ${c.invId
                      ? `<span class="badge-tag badge-inv">🔗 ${c.invId}</span>`
                      : `<span class="badge-tag badge-no-inv">Standalone (No Order INV)</span>`}
                  </div>
                  <button class="status-cycle-btn ${stClass}" onclick="cycleClaimStatus('${c.claimId}')">${stText}</button>
                </div>
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:5px;">Date: ${c.date} · ${c.category}</div>
                <div style="font-size:13.5px;font-weight:800;color:var(--navy-main);margin-bottom:3px;">Items: ${c.items}</div>
                <div class="card-desc">Note: ${c.reason}</div>
                ${photoGridHtml}
              </div>
            `;
          });
        }

        html += `
          <div class="nav-header" style="margin-top:18px;">
            <div>
              <div class="section-label">ORDER INVOICE DETECTION</div>
              <div class="section-heading">Invoices & Claim Status (${orderHistory.length})</div>
            </div>
          </div>
        `;

        const filteredOrders = orderHistory.filter(o =>
          !searchQuery ||
          o.invId.toLowerCase().includes(searchQuery) ||
          o.items.some(i => i.name.toLowerCase().includes(searchQuery))
        );

        if (filteredOrders.length === 0) {
          html += `<div class="gold-card"><div class="card-desc">No orders logged yet. Starting Invoice: <b>${formatInvoiceId(nextInvNum)}</b></div></div>`;
        } else {
          filteredOrders.forEach(o => {
            const linkedClaims = claimHistory.filter(c => c.invId && c.invId.toUpperCase() === o.invId.toUpperCase());
            html += `
              <div class="claim-record-card">
                <div class="claim-record-top">
                  <div>
                    <div style="font-size:11.5px;font-weight:700;color:var(--text-muted);">${o.date}</div>
                    <div style="font-size:15px;font-weight:800;color:var(--navy-main);">${o.invId}</div>
                  </div>
                  ${linkedClaims.length > 0
                    ? `<span class="badge-tag status-pending">🛡️ Claimed: ${linkedClaims.map(x => x.claimId).join(', ')}</span>`
                    : `<span class="badge-tag status-done">✓ No Claim</span>`}
                </div>
                <div style="font-size:12.5px;color:var(--text-main);line-height:1.5;margin-top:4px;">
                  ${o.items.map((it, idx) => `${idx + 1}. [${it.brand}] ${it.name} x <b>${it.qty}</b>`).join('<br>')}
                </div>
              </div>
            `;
          });
        }
      }

      container.innerHTML = html;
      renderStaffPhotoGrid();
      return;
    }

    /* -------- 2. 首页 RMA 保修视图（含拍照与保存图片功能） -------- */
    if (viewState === 'rma') {
      const enabledCats = catalogData.filter(c => c.warrantyEnabled);
      html += `
        <div class="nav-header">
          <div>
            <div class="section-label">WARRANTY & RETURN</div>
            <div class="section-heading">${t.rmaTitle}</div>
          </div>
          <div class="nav-btn-group">
            <button class="main-menu-btn" onclick="goMainMenu()">${t.mainMenu}</button>
          </div>
        </div>

        <div class="claim-id-banner">
          <div>
            <div style="font-size:11.5px;color:var(--gold-light);font-weight:700;">${getTodayFormatted()}</div>
            <div style="font-size:19px;font-weight:800;letter-spacing:0.5px;">${formatClaimId(nextClaimNum)}</div>
          </div>
          <span class="badge-tag" style="background:rgba(255,255,255,0.14);color:#FFF;">Auto Serial Proof</span>
        </div>

        <div class="gold-card">
          <div class="form-group">
            <label class="form-label">Related Invoice No. (Optional — Leave blank if no order)</label>
            <input type="text" id="rma-inv-input" class="form-control" placeholder="e.g. INV-000051 (or leave empty)" oninput="autoFillInvoiceItems(this.value)">
            <div id="inv-match-hint" style="margin-top:5px;font-size:11.5px;color:var(--text-muted);">
              No Invoice entered — will be saved directly under <b>${formatClaimId(nextClaimNum)}</b> as standalone warranty proof.
            </div>
          </div>

          <!-- 新增：拍照与保存保修图片模块 -->
          <div class="form-group">
            <label class="form-label">Warranty Photo Proof (Take Photo & Save Image)</label>
            <input type="file" id="rma-camera-input" accept="image/*" capture="environment" style="display:none;" onchange="handlePhotoInput(this.files, 'rma')">
            <input type="file" id="rma-gallery-input" accept="image/*" multiple style="display:none;" onchange="handlePhotoInput(this.files, 'rma')">
            <div class="photo-capture-row">
              <button type="button" class="camera-btn" onclick="document.getElementById('rma-camera-input').click()">${t.takePhoto}</button>
              <button type="button" class="gallery-btn" onclick="document.getElementById('rma-gallery-input').click()">${t.choosePhoto}</button>
            </div>
            <div class="card-desc" style="margin-top:5px;">Photos are saved with <b>${formatClaimId(nextClaimNum)}</b>. Tap <b>⬇ Save</b> on any photo to also save a copy to your phone.</div>
            <div id="rma-photo-grid" class="photo-grid"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Product Category</label>
            <select id="rma-cat-select" class="form-control">
              ${enabledCats.length > 0
                ? enabledCats.map(c => `<option value="${c.title.en}">${c.title[currentLang]}</option>`).join('')
                : `<option value="General">General Warranty</option>`}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Defective Item(s) & Quantity *</label>
            <textarea id="rma-items-input" rows="2" class="form-control" placeholder="e.g. [5K STARTER KIT] PRO POD BLACK x 2"></textarea>
          </div>

          <div class="form-group" style="margin-bottom:4px;">
            <label class="form-label">Issue / Evidence Note</label>
            <input type="text" id="rma-reason-input" class="form-control" placeholder="e.g. Cannot charge / Leaking">
          </div>

          <div class="claim-btn-row">
            <button class="copy-order-btn" onclick="handleClaimCopy()">
              <svg fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Copy Claim</span>
            </button>
            <button class="wa-order-btn" onclick="handleClaimWhatsApp()">
              <svg viewBox="0 0 24 24">
                <path d="M12.031 2c-5.506 0-9.987 4.478-9.989 9.984a9.964 9.964 0 0 0 1.333 4.993L2 22l5.233-1.237a9.994 9.994 0 0 0 4.793 1.217h.004c5.505 0 9.986-4.478 9.988-9.984 0-2.668-1.037-5.176-2.922-7.062A9.935 9.935 0 0 0 12.031 2zm5.824 14.12c-.245.688-1.421 1.318-1.976 1.402-.508.076-1.15.109-1.856-.116-.428-.136-.979-.318-1.685-.622-2.964-1.28-4.9-4.265-5.048-4.462-.147-.197-1.206-1.605-1.206-3.062 0-1.456.763-2.172 1.034-2.468.271-.296.591-.37.788-.37.197 0 .394.002.566.01.182.009.426-.069.666.508.246.592.837 2.047.911 2.195.074.148.123.321.025.518-.099.198-.148.321-.296.494-.148.173-.311.386-.444.518-.148.148-.302.309-.13.605.173.296.766 1.264 1.645 2.048 1.13.1008 2.083 1.32 2.379 1.468.296.148.468.123.641-.074.173-.197.739-.863.936-1.159.197-.296.394-.247.665-.148.271.099 1.724.813 2.02.961.295.148.492.222.566.345.074.123.074.715-.171 1.403z"/>
              </svg>
              <span>Send Claim</span>
            </button>
          </div>
        </div>

        <div class="gold-card">
          <div class="form-label">Check Claim / Invoice Warranty Status</div>
          <div style="display:flex;gap:8px;">
            <input type="text" id="rma-lookup-input" class="form-control" placeholder="Enter CLAIM-00001 or INV-000051">
            <button class="back-btn" style="background:var(--navy-main);color:#FFF;border-color:var(--navy-main);" onclick="lookupClaimOrInv()">Check</button>
          </div>
          <div id="rma-lookup-result"></div>
        </div>
      `;
      container.innerHTML = html;
      renderRmaPhotoGrid();
      return;
    }

    /* -------- 3. 前台搜索或分类层级视图（带 Main Menu + Back） -------- */
    if (viewState === 'categories' && searchQuery) {
      html += `
        <div class="nav-header">
          <div>
            <div class="section-label">SEARCH RESULTS</div>
            <div class="section-heading">"${searchQuery}"</div>
          </div>
          <button class="main-menu-btn" onclick="goMainMenu()">${t.mainMenu}</button>
        </div>
      `;
      let foundAny = false;
      catalogData.forEach(cat => {
        cat.brands.forEach(brand => {
          brand.products.forEach(prod => {
            if (
              prod.name.toLowerCase().includes(searchQuery) ||
              brand.name.toLowerCase().includes(searchQuery) ||
              cat.title[currentLang].toLowerCase().includes(searchQuery)
            ) {
              foundAny = true;
              html += renderProductCardHtml(prod, brand.name, t);
            }
          });
        });
      });
      if (!foundAny) {
        html += `<div class="gold-card"><div class="card-desc">No matching items found.</div></div>`;
      }
      container.innerHTML = html;
      return;
    }

    if (viewState === 'categories') {
      html += `
        <div class="nav-header">
          <div>
            <div class="section-label">${t.allCategories}</div>
            <div class="section-heading">${t.selectCategory}</div>
          </div>
        </div>
      `;

      catalogData.forEach(cat => {
        html += `
          <div class="gold-card clickable" onclick="openCategory('${cat.id}')">
            <div class="card-left">
              <div class="cat-badge">${cat.badge}</div>
              <div>
                <div class="card-title">${cat.title[currentLang]}</div>
                <div class="card-desc">${cat.desc[currentLang]}</div>
              </div>
            </div>
            <div class="chevron">›</div>
          </div>
        `;
      });

      if (rmaGlobalEnabled) {
        html += `
          <div class="gold-card clickable rma-card" onclick="openRmaModule()">
            <div class="card-left">
              <div class="cat-badge" style="background:linear-gradient(145deg,#1E3A8A,#0F2537);">🛡️</div>
              <div>
                <div class="card-title">${t.rmaTitle}</div>
                <div class="card-desc">${t.rmaDesc}</div>
              </div>
            </div>
            <div class="chevron">›</div>
          </div>
        `;
      }
    } else if (viewState === 'brands') {
      html += `
        <div class="nav-header">
          <div style="min-width:0;">
            <div class="section-label">${activeCategory.title[currentLang]}</div>
            <div class="section-heading">${t.selectBrand}</div>
          </div>
          <div class="nav-btn-group">
            <button class="main-menu-btn" onclick="goMainMenu()">${t.mainMenu}</button>
            <button class="back-btn" onclick="goBack()">${t.back}</button>
          </div>
        </div>
      `;

      activeCategory.brands
        .filter(b => b.name.toLowerCase().includes(searchQuery))
        .forEach(brand => {
          html += `
            <div class="gold-card clickable" onclick="openBrand('${brand.id}')">
              <div class="card-left">
                <div class="cat-badge">${brand.name.substring(0, 2).toUpperCase()}</div>
                <div>
                  <div class="card-title">${brand.name}</div>
                  <div class="card-desc">${brand.desc}</div>
                </div>
              </div>
              <div class="chevron">›</div>
            </div>
          `;
        });
    } else if (viewState === 'products') {
      html += `
        <div class="nav-header">
          <div style="min-width:0;">
            <div class="section-label">${activeCategory.title[currentLang]}</div>
            <div class="section-heading">${activeBrand.name}</div>
          </div>
          <div class="nav-btn-group">
            <button class="main-menu-btn" onclick="goMainMenu()">${t.mainMenu}</button>
            <button class="back-btn" onclick="goBack()">${t.back}</button>
          </div>
        </div>
      `;

      const filteredProducts = activeBrand.products.filter(p => p.name.toLowerCase().includes(searchQuery));
      if (filteredProducts.length === 0) {
        html += `<div class="gold-card"><div class="card-desc">No items found under this brand.</div></div>`;
      } else {
        filteredProducts.forEach(prod => {
          html += renderProductCardHtml(prod, activeBrand.name, t);
        });
      }
    }

    container.innerHTML = html;
  }

  function renderProductCardHtml(prod, brandName, t) {
    const qty = cart[prod.id] ? cart[prod.id].qty : 0;
    const isOut = !prod.inStock;
    return `
      <div class="gold-card product-card ${isOut ? 'sold-out' : ''}">
        <div>
          <div style="font-size:10.5px;font-weight:800;color:var(--gold-primary);margin-bottom:2px;">${brandName}</div>
          <div class="card-title">${prod.name}</div>
          <div class="card-desc">${prod.spec}</div>
          <span class="stock-badge ${isOut ? 'out' : 'in'}">${isOut ? t.soldOut : t.inStock}</span>
        </div>
        <div class="qty-panel ${isOut ? 'disabled-controls' : ''}">
          <div class="bulk-btns">
            <button class="bulk-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', 5)">+5</button>
            <button class="bulk-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', 10)">+10</button>
          </div>
          <div class="step-btns">
            <button class="step-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', -1)">−</button>
            <span class="qty-num">${qty}</span>
            <button class="step-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', 1)">+</button>
          </div>
        </div>
      </div>
    `;
  }

  /* 初始化启动 */
  setLanguage(currentLang);
</script>
</body>
</html>
