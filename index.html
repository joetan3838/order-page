<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5K Wholesale Self-Order</title>
  <style>
    :root {
      --navy-dark: #0B1D2E;
      --navy-main: #0F2537;
      --gold-primary: #C59B47;
      --gold-light: #E2C584;
      --gold-border: #D8C292;
      --bg-outer: #E5E7EB;
      --bg-app: #F8F7F3;
      --card-bg: #FFFFFF;
      --text-main: #111827;
      --text-muted: #6B7280;
      --stock-green: #16A34A;
      --stock-red: #DC2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-outer);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* 手机端居中视口 */
    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg-app);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 84px;
    }

    /* 全宽贴边深蓝顶部 */
    .top-header {
      background: linear-gradient(180deg, var(--navy-dark) 0%, var(--navy-main) 100%);
      padding: 18px 18px 22px;
      color: #FFFFFF;
      border-bottom: 2px solid var(--gold-primary);
    }

    /* 右上角白底胶囊语言切换 */
    .lang-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .lang-pill {
      background-color: #FFFFFF;
      border-radius: 999px;
      padding: 3px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--navy-main);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background-color: var(--navy-main);
      color: #FFFFFF;
    }

    /* 品牌 Logo 与标题区 */
    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* 直接引用 logo.png */
    .logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45));
    }

    .brand-title h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.3px;
      color: #FFFFFF;
    }

    .brand-title p {
      font-size: 12.5px;
      color: var(--gold-light);
      margin-top: 4px;
      font-weight: 500;
    }

    /* 主体内容区 */
    .main-content {
      padding: 16px;
      flex: 1;
    }

    /* 金边立体搜索栏 */
    .search-box {
      position: relative;
      margin-bottom: 18px;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-primary);
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      background-color: #FFFFFF;
      border: 1.5px solid var(--gold-border);
      border-radius: 999px;
      padding: 11px 16px 11px 40px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      box-shadow: 0 3px 10px rgba(15, 37, 55, 0.05);
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--gold-primary);
    }

    /* 面包屑与返回按钮 */
    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .section-heading {
      font-size: 17px;
      font-weight: 800;
      color: var(--navy-main);
      margin-top: 2px;
    }

    .back-btn {
      background-color: #FFFFFF;
      border: 1.5px solid var(--gold-border);
      color: var(--navy-main);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
    }

    /* 金边立体卡片 */
    .gold-card {
      background-color: var(--card-bg);
      border: 1.5px solid var(--gold-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(15, 37, 55, 0.06);
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.2s;
    }

    .gold-card.clickable {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .gold-card.clickable:active {
      transform: scale(0.985);
      border-color: var(--gold-primary);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cat-badge {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0F2537 0%, #1D3E5B 100%);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--navy-main);
      margin-bottom: 3px;
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .chevron {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #FAF6EE;
      border: 1px solid var(--gold-border);
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
    }

    /* 售后专属样式（虚线金色框） */
    .rma-card {
      border: 1.5px dashed var(--gold-primary);
      background-color: #FAF9F5;
    }

    .rma-icon {
      color: #3B82F6;
      font-size: 18px;
    }

    /* 单品卡片与快捷数量按钮 */
    .product-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .product-card.sold-out {
      opacity: 0.65;
      background-color: #F3F4F6;
      border-color: #D1D5DB;
    }

    .stock-badge {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      margin-top: 6px;
      letter-spacing: 0.3px;
    }

    .stock-badge.in {
      background-color: var(--stock-green);
      color: #FFFFFF;
    }

    .stock-badge.out {
      background-color: var(--stock-red);
      color: #FFFFFF;
    }

    .qty-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .bulk-btns {
      display: flex;
      gap: 5px;
    }

    .bulk-btn {
      background-color: var(--navy-main);
      color: #FFFFFF;
      border: 1px solid var(--gold-primary);
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 8px;
      cursor: pointer;
    }

    .step-btns {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--gold-border);
      background-color: #FAF6EE;
      color: var(--navy-main);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .qty-num {
      font-size: 15px;
      font-weight: 800;
      min-width: 20px;
      text-align: center;
    }

    .disabled-controls button {
      background-color: #D1D5DB !important;
      border-color: #9CA3AF !important;
      color: #6B7280 !important;
      cursor: not-allowed;
    }

    /* 底部固定深蓝金结算栏 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background-color: var(--navy-main);
      border-top: 2px solid var(--gold-primary);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .summary-text {
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 700;
    }

    .summary-sub {
      color: var(--gold-light);
      font-size: 11px;
      margin-top: 2px;
    }

    .send-btn {
      background: linear-gradient(135deg, #D4AF37 0%, #B88E35 100%);
      color: #FFFFFF;
      border: 1px solid #F3E5AB;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    .send-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- 全宽深蓝顶部 -->
  <header class="top-header">
    <div class="lang-row">
      <div class="lang-pill">
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" id="btn-bm" onclick="setLanguage('bm')">BM</button>
        <button class="lang-btn" id="btn-zh" onclick="setLanguage('zh')">中文</button>
      </div>
    </div>

    <div class="brand-row">
      <!-- 完美还原 3D 金属 5K Logo -->
      <img src="logo.png" alt="5K Logo" class="logo-img" onerror="this.src='data:image/svg+xml;utf8,<svg viewBox=\'0 0 100 100\' width=\'64\' height=\'64\'><circle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%2307131E\' stroke=\'%23C59B47\' stroke-width=\'4\'/><text x=\'50\' y=\'60\' text-anchor=\'middle\' fill=\'%23C59B47\' font-weight=\'bold\' font-size=\'30\'>5K</text></svg>'">

      <div class="brand-title">
        <h1>5K Wholesale<br>Self-Order</h1>
        <p id="ui-subtitle">Orderan Borong / Wholesale Order</p>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <div class="search-box">
      <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="search-input" id="search-input" oninput="handleSearch(this.value)" placeholder="Search category, brand or flavor...">
    </div>

    <div id="app-view"></div>
  </main>

  <!-- 底部固定深蓝金条 -->
  <footer class="bottom-bar">
    <div>
      <div class="summary-text" id="cart-summary">Selected: 0 items · 0 types</div>
      <div class="summary-sub" id="inv-preview">Auto Invoice ID Ready</div>
    </div>
    <button class="send-btn" onclick="sendWhatsApp()">
      <span id="ui-send-btn">Send to WhatsApp</span>
    </button>
  </footer>
</div>

<script>
  // 1. 三语字典与永久语言记忆（localStorage）
  const i18n = {
    en: {
      subtitle: "Orderan Borong / Wholesale Order",
      searchPlaceholder: "Search category, brand or code...",
      allCategories: "ALL CATEGORIES",
      selectCategory: "Select Product Category",
      selectBrand: "Select Brand / Company",
      back: "Back",
      selected: (qty, types) => `Selected: ${qty} items · ${types} types`,
      sendBtn: "Send to WhatsApp",
      inStock: "IN STOCK",
      soldOut: "SOLD OUT"
    },
    bm: {
      subtitle: "Sistem Pesanan Borong Rasmi 5K",
      searchPlaceholder: "Cari kategori, jenama atau perisa...",
      allCategories: "SEMUA KATEGORI",
      selectCategory: "Pilih Kategori Produk",
      selectBrand: "Pilih Jenama / Syarikat",
      back: "Kembali",
      selected: (qty, types) => `Dipilih: ${qty} unit · ${types} jenis`,
      sendBtn: "Hantar ke WhatsApp",
      inStock: "ADA STOK",
      soldOut: "HABIS STOK"
    },
    zh: {
      subtitle: "5K 批发自助下单系统",
      searchPlaceholder: "搜索大类、品牌或口味编号...",
      allCategories: "全部商品大类",
      selectCategory: "请选择商品分类",
      selectBrand: "请选择品牌 / 公司",
      back: "返回",
      selected: (qty, types) => `已选：${qty} 件 · ${types} 款`,
      sendBtn: "发送至 WhatsApp",
      inStock: "有货 IN STOCK",
      soldOut: "已售罄 SOLD OUT"
    }
  };

  let currentLang = localStorage.getItem('5k_permanent_lang') || 'en';

  // 2. 多级商品底层数据
  const catalogData = [
    {
      id: "eliquid",
      badge: "EL",
      title: { en: "E-Liquid / Flavors", bm: "E-Liquid / Perisa", zh: "E-Liquid / 烟油口味" },
      desc: { en: "Freebase & Saltnic wholesale series", bm: "Koleksi borong Freebase & Saltnic", zh: "小烟与大烟全系列批发口味" },
      brands: [
        {
          id: "unplug",
          name: "UNPLUG",
          desc: "15ml / 30ml · Saltnic & Freebase",
          products: [
            { id: "UP-01", name: "01 - MANGO", spec: "Nicotine: 3% · Freebase", inStock: true },
            { id: "UP-02", name: "02 - GRAPE", spec: "Nicotine: 3% · Freebase", inStock: true },
            { id: "UP-03", name: "03 - LYCHEE ICE", spec: "Nicotine: 3% · Freebase", inStock: false }
          ]
        }
      ]
    },
    {
      id: "occ",
      badge: "OC",
      title: { en: "OCC / Cartridge", bm: "OCC / Katrij", zh: "OCC / 雾化芯与空烟弹" },
      desc: { en: "Replacement pods, cartridges & coils", bm: "Pod gantian, katrij & coil", zh: "各品牌替换空烟弹与雾化芯" },
      brands: [
        {
          id: "sample-occ",
          name: "Brand List (Ready to Add)",
          desc: "Send OCC list to populate items",
          products: []
        }
      ]
    },
    {
      id: "device",
      badge: "DV",
      title: { en: "Device (Pod / Kit Set)", bm: "Peranti (Pod / Kit Set)", zh: "Device / 主机与套装" },
      desc: { en: "Pod systems, devices & starter kit sets", bm: "Sistem pod, peranti & set permulaan", zh: "Pod 主机、杆子与完整套装" },
      brands: [
        {
          id: "sample-device",
          name: "Brand List (Ready to Add)",
          desc: "Send Device list to populate items",
          products: []
        }
      ]
    }
  ];

  // 3. 路由与购物车状态
  let viewState = 'categories'; // 'categories' | 'brands' | 'products'
  let activeCategory = null;
  let activeBrand = null;
  let searchQuery = '';
  let cart = {};

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('5k_permanent_lang', lang);
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');

    const t = i18n[currentLang];
    document.getElementById('ui-subtitle').textContent = t.subtitle;
    document.getElementById('search-input').placeholder = t.searchPlaceholder;
    document.getElementById('ui-send-btn').textContent = t.sendBtn;
    updateCartSummary();
    renderView();
  }

  function handleSearch(val) {
    searchQuery = val.trim().toLowerCase();
    renderView();
  }

  function openCategory(catId) {
    activeCategory = catalogData.find(c => c.id === catId);
    viewState = 'brands';
    searchQuery = '';
    document.getElementById('search-input').value = '';
    renderView();
  }

  function openBrand(brandId) {
    activeBrand = activeCategory.brands.find(b => b.id === brandId);
    viewState = 'products';
    searchQuery = '';
    document.getElementById('search-input').value = '';
    renderView();
  }

  function goBack() {
    if (viewState === 'products') {
      viewState = 'brands';
    } else if (viewState === 'brands') {
      viewState = 'categories';
    }
    searchQuery = '';
    document.getElementById('search-input').value = '';
    renderView();
  }

  function changeQty(prodId, prodName, brandName, delta) {
    const current = cart[prodId] ? cart[prodId].qty : 0;
    const next = Math.max(0, current + delta);
    if (next === 0) {
      delete cart[prodId];
    } else {
      cart[prodId] = { name: prodName, brand: brandName, qty: next };
    }
    updateCartSummary();
    renderView();
  }

  function updateCartSummary() {
    const items = Object.values(cart);
    const totalQty = items.reduce((sum, item) => sum + item.qty, 0);
    const totalTypes = items.length;
    document.getElementById('cart-summary').textContent = i18n[currentLang].selected(totalQty, totalTypes);
  }

  function renderView() {
    const container = document.getElementById('app-view');
    const t = i18n[currentLang];
    let html = '';

    if (viewState === 'categories') {
      html += `
        <div class="nav-header">
          <div>
            <div class="section-label">${t.allCategories}</div>
            <div class="section-heading">${t.selectCategory}</div>
          </div>
        </div>
      `;

      catalogData
        .filter(cat => cat.title[currentLang].toLowerCase().includes(searchQuery) || cat.title.en.toLowerCase().includes(searchQuery))
        .forEach(cat => {
          html += `
            <div class="gold-card clickable" onclick="openCategory('${cat.id}')">
              <div class="card-left">
                <div class="cat-badge">${cat.badge}</div>
                <div>
                  <div class="card-title">${cat.title[currentLang]}</div>
                  <div class="card-desc">${cat.desc[currentLang]}</div>
                </div>
              </div>
              <div class="chevron">›</div>
            </div>
          `;
        });

      // 售后服务快捷入口（虚线金色框）
      html += `
        <div class="gold-card clickable rma-card" onclick="alert('Navigating to RMA Module...')">
          <div class="card-left">
            <span class="rma-icon">🛡️</span>
            <div>
              <div class="card-title" style="color: var(--navy-main)">Return / Warranty Claim (RMA)</div>
              <div class="card-desc">Check status, return broken goods & claims</div>
            </div>
          </div>
          <div class="chevron">›</div>
        </div>
      `;
    } else if (viewState === 'brands') {
      html += `
        <div class="nav-header">
          <div>
            <div class="section-label">${activeCategory.title[currentLang]}</div>
            <div class="section-heading">${t.selectBrand}</div>
          </div>
          <button class="back-btn" onclick="goBack()">‹ ${t.back}</button>
        </div>
      `;

      activeCategory.brands
        .filter(b => b.name.toLowerCase().includes(searchQuery))
        .forEach(brand => {
          html += `
            <div class="gold-card clickable" onclick="openBrand('${brand.id}')">
              <div class="card-left">
                <div class="cat-badge">${brand.name.substring(0, 2).toUpperCase()}</div>
                <div>
                  <div class="card-title">${brand.name}</div>
                  <div class="card-desc">${brand.desc}</div>
                </div>
              </div>
              <div class="chevron">›</div>
            </div>
          `;
        });
    } else if (viewState === 'products') {
      html += `
        <div class="nav-header">
          <div>
            <div class="section-label">${activeCategory.title[currentLang]}</div>
            <div class="section-heading">${activeBrand.name}</div>
          </div>
          <button class="back-btn" onclick="goBack()">‹ ${t.back}</button>
        </div>
      `;

      const filteredProducts = activeBrand.products.filter(p => p.name.toLowerCase().includes(searchQuery));
      if (filteredProducts.length === 0) {
        html += `<div class="gold-card"><div class="card-desc">No items added under this brand yet.</div></div>`;
      } else {
        filteredProducts.forEach(prod => {
          const qty = cart[prod.id] ? cart[prod.id].qty : 0;
          const isOut = !prod.inStock;
          html += `
            <div class="gold-card product-card ${isOut ? 'sold-out' : ''}">
              <div>
                <div class="card-title">${prod.name}</div>
                <div class="card-desc">${prod.spec}</div>
                <span class="stock-badge ${isOut ? 'out' : 'in'}">${isOut ? t.soldOut : t.inStock}</span>
              </div>
              <div class="qty-panel ${isOut ? 'disabled-controls' : ''}">
                <div class="bulk-btns">
                  <button class="bulk-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}','${prod.name}','${activeBrand.name}',5)">+5</button>
                  <button class="bulk-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}','${prod.name}','${activeBrand.name}',10)">+10</button>
                </div>
                <div class="step-btns">
                  <button class="step-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}','${prod.name}','${activeBrand.name}',-1)">-</button>
                  <span class="qty-num">${qty}</span>
                  <button class="step-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}','${prod.name}','${activeBrand.name}',1)">+</button>
                </div>
              </div>
            </div>
          `;
        });
      }
    }

    container.innerHTML = html;
  }

  function sendWhatsApp() {
    const items = Object.values(cart);
    if (items.length === 0) {
      alert(currentLang === 'zh' ? '请先选择至少一件商品' : 'Please select at least 1 item first.');
      return;
    }
    const invoiceId = 'INV-' + Date.now().toString().slice(-6);
    let msg = `*5K WHOLESALE ORDER*\nInvoice No: *${invoiceId}*\n------------------\n`;
    items.forEach((item, idx) => {
      msg += `${idx + 1}. [${item.brand}] ${item.name} x *${item.qty}*\n`;
    });
    const url = `https://wa.me/601126344468?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  setLanguage(currentLang);
</script>
