<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNPLUG & OFFGRID 批发自助下单</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding: 16px;
      padding-bottom: 120px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      border-bottom: 2px solid #000000;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: bold;
    }
    .subtitle {
      font-size: 14px;
      color: #333;
      margin-top: 4px;
    }
    .search-box {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #000000;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 18px;
      font-weight: bold;
      background-color: #eee;
      padding: 8px 12px;
      margin: 16px 0 12px 0;
      border-left: 4px solid #000000;
    }
    .product-card {
      border: 1px solid #ccc;
      padding: 12px;
      margin-bottom: 12px;
      background: #fff;
    }
    .product-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .product-name {
      font-size: 18px;
      font-weight: bold;
    }
    .product-code {
      font-weight: bold;
      background: #000;
      color: #fff;
      padding: 2px 6px;
      margin-right: 8px;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }
    button {
      font-size: 16px;
      padding: 8px 14px;
      cursor: pointer;
      background: #fff;
      border: 1px solid #000;
      font-weight: bold;
    }
    button:active {
      background: #ddd;
    }
    .qty-display {
      font-size: 18px;
      font-weight: bold;
      min-width: 36px;
      text-align: center;
    }
    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 2px solid #000;
      padding: 12px 16px;
    }
    .footer-content {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-text {
      font-size: 18px;
      font-weight: bold;
    }
    .checkout-btn {
      background-color: #000;
      color: #fff;
      font-size: 18px;
      padding: 12px 24px;
      border: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>UNPLUG 批发自助下单</h1>
    <p class="subtitle">点击加减号选择数量，一键发送订单</p>
  </header>

  <input type="text" id="searchInput" class="search-box" placeholder="输入名称或编号搜索..." onkeyup="filterProducts()">

  <div id="catalog"></div>
</div>

<div class="footer-bar">
  <div class="footer-content">
    <div class="summary-text" id="summary">已选: 0 样商品</div>
    <button class="checkout-btn" onclick="sendOrder()">发送订单</button>
  </div>
</div>

<script>
  const WHATSAPP_NUMBER = "60123456789"; // 请在此处修改您的号码

  const products = [
    { code: "C1", name: "OFFGRID RELOAD 空烟弹", category: "配件" },
    { code: "01", name: "芒果", category: "烟油" },
    { code: "02", name: "葡萄", category: "烟油" },
    { code: "03", name: "草莓", category: "烟油" },
    { code: "04", name: "黑加仑综合莓果", category: "烟油" },
    { code: "05", name: "黑加仑荔枝", category: "烟油" },
    { code: "06", name: "芒果凤梨", category: "烟油" },
    { code: "07", name: "凤梨苹果", category: "烟油" },
    { code: "08", name: "水蜜桃草莓", category: "烟油" },
    { code: "09", name: "奇异果芒果西瓜", category: "烟油" },
    { code: "10", name: "草莓葡萄苹果", category: "烟油" },
    { code: "11", name: "凤梨莓果", category: "烟油" },
    { code: "12", name: "西瓜", category: "烟油" },
    { code: "13", name: "哈密瓜凤梨", category: "烟油" },
    { code: "14", name: "芒果黑加仑", category: "烟油" },
    { code: "15", name: "苹果葡萄", category: "烟油" },
    { code: "16", name: "黑加仑酸奶", category: "烟油" },
    { code: "17", name: "哈密瓜葡萄", category: "烟油" },
    { code: "18", name: "哈密瓜青柠", category: "烟油" },
    { code: "19", name: "芒果青柠", category: "烟油" },
    { code: "20", name: "草莓黑加仑", category: "烟油" }
  ];

  let cart = {};

  function renderCatalog(data) {
    const catalogDiv = document.getElementById('catalog');
    catalogDiv.innerHTML = '';
    let currentCategory = '';

    data.forEach(p => {
      if (p.category !== currentCategory) {
        currentCategory = p.category;
        const catHeader = document.createElement('div');
        catHeader.className = 'section-title';
        catHeader.innerText = currentCategory;
        catalogDiv.appendChild(catHeader);
      }

      const card = document.createElement('div');
      card.className = 'product-card';
      let qty = cart[p.code] || 0;

      card.innerHTML = `
        <div class="product-info">
          <div class="product-name"><span class="product-code">${p.code}</span>${p.name}</div>
        </div>
        <div class="controls">
          <button onclick="updateQty('${p.code}', -1)">-</button>
          <span class="qty-display" id="qty-${p.code}">${qty}</span>
          <button onclick="updateQty('${p.code}', 1)">+</button>
        </div>
      `;
      catalogDiv.appendChild(card);
    });
  }

  function updateQty(code, change) {
    cart[code] = (cart[code] || 0) + change;
    if (cart[code] < 0) cart[code] = 0;
    document.getElementById(`qty-${code}`).innerText = cart[code];
    updateSummary();
  }

  function updateSummary() {
    let totalItems = 0;
    for (let code in cart) {
      totalItems += cart[code];
    }
    document.getElementById('summary').innerText = `已选: ${totalItems} 样商品`;
  }

  function filterProducts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = products.filter(p => 
      p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query)
    );
    renderCatalog(filtered);
  }

  function sendOrder() {
    let orderText = "批发订单:%0A";
    let hasItems = false;
    for (let code in cart) {
      if (cart[code] > 0) {
        const product = products.find(p => p.code === code);
        orderText += `${product.code}. ${product.name} x ${cart[code]}%0A`;
        hasItems = true;
      }
    }

    if (!hasItems) {
      alert("请先选择商品");
      return;
    }

    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${orderText}`;
    window.open(url, '_blank');
  }

  renderCatalog(products);
</script>

</body>
</html>
