<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批发自助下单</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      padding: 16px;
      padding-bottom: 130px;
      line-height: 1.5;
    }
    h1 {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      border-bottom: 3px solid #000000;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .tip {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
      padding: 10px;
      border: 2px solid #000000;
      background-color: #f5f5f5;
    }
    .item {
      border: 2px solid #000000;
      padding: 14px;
      margin-bottom: 14px;
      background-color: #ffffff;
    }
    .item-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      font-size: 22px;
      font-weight: bold;
      padding: 10px 18px;
      border: 2px solid #000000;
      background-color: #ffffff;
      color: #000000;
      cursor: pointer;
      min-width: 56px;
    }
    .btn:active {
      background-color: #dddddd;
    }
    .qty {
      font-size: 24px;
      font-weight: bold;
      min-width: 48px;
      text-align: center;
    }
    .quick-group, .step-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ffffff;
      border-top: 3px solid #000000;
      padding: 14px 16px;
    }
    .summary {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .send-btn {
      width: 100%;
      font-size: 24px;
      font-weight: bold;
      padding: 14px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>UNPLUG 批发自助下单</h1>
  <div class="tip">请选择商品数量，选好后点击最下方黑色按钮发送订单至 WhatsApp。</div>

  <div id="product-list"></div>

  <div class="footer">
    <div class="summary">
      <span>已选总数量：</span>
      <span id="total-qty">0 件</span>
    </div>
    <button class="send-btn" onclick="sendToWhatsApp()">一键发送订单至 WhatsApp</button>
  </div>

  <script>
    // 1. 在这里改成你自己的 WhatsApp 号码（马来西亚号码以 60 开头，去掉前面的 0）
    const WHATSAPP_NUMBER = "60123456789";

    // 2. 在这里修改或补充你的全部 21 款商品
    const PRODUCTS = [
      { id: "C1", name: "C1 - OFFGRID RELOAD 空烟弹 (Pod Cartridge)" },
      { id: "01", name: "01 - 口味示例一（请替换为实际口味）" },
      { id: "02", name: "02 - 口味示例二（请替换为实际口味）" },
      { id: "03", name: "03 - 口味示例三（请替换为实际口味）" }
    ];

    const cart = {};
    PRODUCTS.forEach(p => cart[p.id] = 0);

    function render() {
      const list = document.getElementById("product-list");
      list.innerHTML = "";
      let total = 0;

      PRODUCTS.forEach(p => {
        total += cart[p.id];
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="item-name">${p.name}</div>
          <div class="controls">
            <div class="quick-group">
              <button class="btn" onclick="changeQty('${p.id}', 5)">+5</button>
              <button class="btn" onclick="changeQty('${p.id}', 10)">+10</button>
            </div>
            <div class="step-group">
              <button class="btn" onclick="changeQty('${p.id}', -1)">-</button>
              <span class="qty">${cart[p.id]}</span>
              <button class="btn" onclick="changeQty('${p.id}', 1)">+</button>
            </div>
          </div>
        `;
        list.appendChild(div);
      });

      document.getElementById("total-qty").textContent = total + " 件";
    }

    function changeQty(id, delta) {
      cart[id] = Math.max(0, cart[id] + delta);
      render();
    }

    function sendToWhatsApp() {
      const lines = ["批发订单明细：", "----------------"];
      let total = 0;

      PRODUCTS.forEach(p => {
        if (cart[p.id] > 0) {
          lines.push(p.name + " x " + cart[p.id]);
          total += cart[p.id];
        }
      });

      if (total === 0) {
        alert("请先选择至少一件商品。");
        return;
      }

      lines.push("----------------");
      lines.push("合计总数量：" + total + " 件");

      const text = encodeURIComponent(lines.join("\n"));
      window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + text, "_blank");
    }

    render();
  </script>
</body>
</html>
