<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>5K Wholesale Self-Order</title>
  <!-- 引入现代几何无衬线字体与中文适配字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-dark: #081726;
      --navy-main: #0F2537;
      --navy-light: #1B3B56;
      --gold-primary: #C59B47;
      --gold-bright: #E5C168;
      --gold-light: #EAD296;
      --gold-border: #D8C292;
      --bg-outer: #DCE1E7;
      --bg-app: #F8F6F0;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --stock-green: #16A34A;
      --stock-red: #DC2626;
      --copy-bg: #1B365D;
      --copy-border: #7BA7E1;
      --wa-green: #25D366;
      --wa-green-dark: #1DA851;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-outer);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-variant-numeric: tabular-nums;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg-app);
      box-shadow: 0 0 36px rgba(8, 23, 38, 0.18);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 96px;
    }

    /* 顶部深海蓝金边栏 */
    .top-header {
      background: linear-gradient(180deg, var(--navy-dark) 0%, var(--navy-main) 100%);
      padding: 16px 16px 20px;
      color: #FFFFFF;
      border-bottom: 2.5px solid var(--gold-primary);
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      box-shadow: 0 6px 18px rgba(11, 29, 46, 0.18);
    }

    .top-bar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .admin-entry-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(216, 194, 146, 0.35);
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .admin-entry-btn.active-mode {
      background: var(--gold-primary);
      color: var(--navy-dark);
      border-color: #FFF3C4;
    }

    .lang-pill {
      background-color: #FFFFFF;
      border-radius: 999px;
      padding: 3px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--navy-main);
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .lang-btn.active {
      background-color: var(--navy-main);
      color: #FFFFFF;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* 强化立体厚度的 3D 金属徽标 */
    .logo-emblem {
      width: 74px;
      height: 74px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.65));
      cursor: pointer;
      user-select: none;
    }

    .logo-emblem svg {
      width: 74px;
      height: 74px;
      display: block;
    }

    .brand-title h1 {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.16;
      letter-spacing: -0.4px;
      color: #FFFFFF;
    }

    .brand-title p {
      font-size: 12.5px;
      color: var(--gold-light);
      margin-top: 4px;
      font-weight: 600;
    }

    /* 主内容区 */
    .main-content {
      padding: 16px;
      flex: 1;
    }

    .search-box {
      position: relative;
      margin-bottom: 16px;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-primary);
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      background-color: #FFFFFF;
      border: 1.5px solid var(--gold-border);
      border-radius: 999px;
      padding: 11px 16px 11px 40px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-main);
      outline: none;
      box-shadow: 0 3px 10px rgba(15, 37, 55, 0.05);
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--gold-primary);
    }

    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .section-heading {
      font-size: 17px;
      font-weight: 800;
      color: var(--navy-main);
      margin-top: 2px;
      letter-spacing: -0.2px;
    }

    .back-btn {
      background-color: #FFFFFF;
      border: 1.5px solid var(--gold-border);
      color: var(--navy-main);
      font-size: 12.5px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
      flex-shrink: 0;
    }

    /* 金边立体卡片 */
    .gold-card {
      background-color: var(--card-bg);
      border: 1.5px solid var(--gold-border);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 11px;
      box-shadow: 0 4px 12px rgba(15, 37, 55, 0.05);
      transition: transform 0.12s ease, border-color 0.2s;
    }

    .gold-card.clickable {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .gold-card.clickable:active {
      transform: scale(0.985);
      border-color: var(--gold-primary);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cat-badge {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(145deg, #16334D 0%, #0B1D2E 100%);
      border: 1.2px solid var(--gold-primary);
      color: var(--gold-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13.5px;
      flex-shrink: 0;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.18);
    }

    .card-title {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--navy-main);
      margin-bottom: 2px;
      letter-spacing: -0.2px;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .chevron {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #FAF6EE;
      border: 1px solid var(--gold-border);
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      flex-shrink: 0;
    }

    .rma-card {
      border: 1.5px dashed var(--gold-primary);
      background: linear-gradient(180deg, #FFFFFF 0%, #FAF7EF 100%);
    }

    /* 商品卡片与加购区 */
    .product-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .product-card.sold-out {
      opacity: 0.62;
      background-color: #F1F5F9;
      border-color: #CBD5E1;
    }

    .stock-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 2.5px 8px;
      border-radius: 999px;
      margin-top: 6px;
      letter-spacing: 0.4px;
    }

    .stock-badge.in {
      background-color: #DCFCE7;
      color: #15803D;
      border: 1px solid #86EFAC;
    }

    .stock-badge.out {
      background-color: #FEE2E2;
      color: #B91C1C;
      border: 1px solid #FCA5A5;
    }

    .qty-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .bulk-btns {
      display: flex;
      gap: 5px;
    }

    .bulk-btn {
      background-color: var(--navy-main);
      color: #FFFFFF;
      border: 1px solid var(--gold-primary);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      cursor: pointer;
    }

    .step-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-btn {
      width: 27px;
      height: 27px;
      border-radius: 7px;
      border: 1px solid var(--gold-border);
      background-color: #FAF6EE;
      color: var(--navy-main);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .qty-num {
      font-size: 15px;
      font-weight: 800;
      min-width: 22px;
      text-align: center;
    }

    .disabled-controls button {
      background-color: #E2E8F0 !important;
      border-color: #CBD5E1 !important;
      color: #94A3B8 !important;
      cursor: not-allowed;
    }

    /* 底部固定栏：左侧日期在上 + INV 在下，右侧区分颜色的 Copy Order 与 Send to WhatsApp */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background: linear-gradient(180deg, var(--navy-main) 0%, var(--navy-dark) 100%);
      border-top: 2.5px solid var(--gold-primary);
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 -6px 20px rgba(8, 23, 38, 0.25);
    }

    .inv-meta-box {
      cursor: pointer;
      min-width: 0;
    }

    .date-line {
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cart-count-pill {
      background-color: var(--gold-primary);
      color: var(--navy-dark);
      font-size: 10.5px;
      font-weight: 800;
      padding: 1.5px 6px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .inv-line {
      color: var(--gold-light);
      font-size: 12.5px;
      font-weight: 700;
      margin-top: 2px;
      letter-spacing: 0.4px;
    }

    .action-btns {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    /* Copy Order 独立蓝金配色 + 标准双框图标 */
    .copy-order-btn {
      background: linear-gradient(180deg, #234575 0%, #162E52 100%);
      color: #FFFFFF;
      border: 1.5px solid var(--copy-border);
      border-radius: 11px;
      padding: 7px 11px;
      font-size: 11.5px;
      font-weight: 800;
      line-height: 1.15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      min-width: 68px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
      transition: transform 0.12s;
    }

    .copy-order-btn svg {
      width: 17px;
      height: 17px;
      stroke: #93C5FD;
    }

    .copy-order-btn:active {
      transform: scale(0.96);
    }

    /* Send to WhatsApp 标准官方绿配色 + 标准图标 */
    .wa-order-btn {
      background: linear-gradient(180deg, var(--wa-green) 0%, var(--wa-green-dark) 100%);
      color: #FFFFFF;
      border: 1.5px solid #6EE7B7;
      border-radius: 11px;
      padding: 7px 13px;
      font-size: 11.5px;
      font-weight: 800;
      line-height: 1.15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      min-width: 108px;
      box-shadow: 0 3px 10px rgba(29, 168, 81, 0.35);
      transition: transform 0.12s;
    }

    .wa-order-btn svg {
      width: 18px;
      height: 18px;
      fill: #FFFFFF;
    }

    .wa-order-btn:active {
      transform: scale(0.96);
    }

    /* 表单与 RMA 样式 */
    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--navy-main);
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--gold-border);
      border-radius: 10px;
      font-size: 13.5px;
      background-color: #FFFFFF;
      color: var(--text-main);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--gold-primary);
    }

    .claim-id-banner {
      background: linear-gradient(135deg, var(--navy-main) 0%, var(--navy-light) 100%);
      color: #FFFFFF;
      border: 1.5px solid var(--gold-primary);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .claim-btn-row {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 8px;
      margin-top: 12px;
    }

    .claim-btn-row .copy-order-btn,
    .claim-btn-row .wa-order-btn {
      flex-direction: row;
      padding: 11px 12px;
      font-size: 12.5px;
      gap: 7px;
      width: 100%;
    }

    /* Admin 一步到位后台样式 */
    .admin-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .admin-tab-btn {
      padding: 10px;
      border-radius: 10px;
      border: 1.5px solid var(--gold-border);
      background-color: #FFFFFF;
      color: var(--navy-main);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .admin-tab-btn.active {
      background-color: var(--navy-main);
      color: var(--gold-bright);
      border-color: var(--gold-primary);
    }

    .instant-toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid #F1F5F9;
      gap: 10px;
    }

    .instant-toggle-row:last-child {
      border-bottom: none;
    }

    .one-click-pill {
      border: none;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      min-width: 98px;
      text-align: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .one-click-pill.on {
      background-color: var(--stock-green);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
    }

    .one-click-pill.off {
      background-color: var(--stock-red);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(220, 38, 38, 0.3);
    }

    .claim-record-card {
      background-color: #FFFFFF;
      border: 1.5px solid var(--gold-border);
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .claim-record-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .badge-navy {
      background-color: var(--navy-main);
      color: var(--gold-bright);
    }

    .badge-inv {
      background-color: #EFF6FF;
      color: #1D4ED8;
      border: 1px solid #BFDBFE;
    }

    .badge-no-inv {
      background-color: #F8FAFC;
      color: #475569;
      border: 1px solid #CBD5E1;
    }

    .status-cycle-btn {
      border: none;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .status-pending {
      background-color: #FEF3C7;
      color: #B45309;
      border: 1px solid #FCD34D;
    }

    .status-done {
      background-color: #DCFCE7;
      color: #15803D;
      border: 1px solid #86EFAC;
    }

    .status-rejected {
      background-color: #FEE2E2;
      color: #B91C1C;
      border: 1px solid #FCA5A5;
    }

    /* 弹窗与轻提示 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(8, 23, 38, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 250;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border: 2px solid var(--gold-primary);
      border-radius: 16px;
      padding: 18px;
      max-height: 82vh;
      overflow-y: auto;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
    }

    .toast-msg {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background-color: var(--navy-dark);
      color: #FFFFFF;
      border: 1.5px solid var(--gold-primary);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
      z-index: 400;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- 顶部深海蓝 + 强化立体 3D 金属徽标 -->
  <header class="top-header">
    <div class="top-bar-controls">
      <button class="admin-entry-btn" id="admin-mode-btn" onclick="toggleAdminAccess()">
        <span id="admin-btn-label">🔒 Admin</span>
      </button>
      <div class="lang-pill">
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" id="btn-bm" onclick="setLanguage('bm')">BM</button>
        <button class="lang-btn" id="btn-zh" onclick="setLanguage('zh')">中文</button>
      </div>
    </div>

    <div class="brand-row">
      <!-- 多层挤压浮雕 3D 金属 5K TRADING 徽标（纯代码内置，无需外部图片） -->
      <div class="logo-emblem" onclick="handleLogoTap()" title="5K Trading">
        <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- 外层斜切高反光黄金斜面 -->
            <linearGradient id="rimOuter3D" x1="12%" y1="6%" x2="88%" y2="94%">
              <stop offset="0%" stop-color="#FFFBE0"/>
              <stop offset="18%" stop-color="#F3CD6B"/>
              <stop offset="42%" stop-color="#9B6E1B"/>
              <stop offset="68%" stop-color="#FCE394"/>
              <stop offset="86%" stop-color="#78520E"/>
              <stop offset="100%" stop-color="#4A3004"/>
            </linearGradient>
            <!-- 反向倒角内圈（制造真实金属凹凸纵深） -->
            <linearGradient id="rimInnerBevel" x1="85%" y1="90%" x2="15%" y2="10%">
              <stop offset="0%" stop-color="#FFF5C0"/>
              <stop offset="35%" stop-color="#D7AC4B"/>
              <stop offset="70%" stop-color="#614109"/>
              <stop offset="100%" stop-color="#F7DC88"/>
            </linearGradient>
            <!-- 深海蓝金属拉丝底盘 -->
            <radialGradient id="navyCore3D" cx="35%" cy="28%" r="72%">
              <stop offset="0%" stop-color="#2B5B84"/>
              <stop offset="48%" stop-color="#10293F"/>
              <stop offset="85%" stop-color="#071522"/>
              <stop offset="100%" stop-color="#030A11"/>
            </radialGradient>
            <!-- 5K 顶面高光浮雕金 -->
            <linearGradient id="faceGold3D" x1="20%" y1="0%" x2="80%" y2="100%">
              <stop offset="0%" stop-color="#FFFFF0"/>
              <stop offset="24%" stop-color="#F8DA7E"/>
              <stop offset="52%" stop-color="#C69330"/>
              <stop offset="78%" stop-color="#FCE69C"/>
              <stop offset="100%" stop-color="#8A5E14"/>
            </linearGradient>

<script>
  /* ================= 核心配置（可直接修改接单号与后台密码） ================= */
  const CONFIG = {

  /* ================= 多语言字典 ================= */
  const i18n = {

      copiedToast: "Senarai pesanan berjaya disalin!",

    },
    zh: {
      subtitle: "5K 批发自助下单系统",
      searchPlaceholder: "搜索分类、品牌或商品编号...",
      allCategories: "主要商品分类",
      selectCategory: "请选择商品分类",
      selectBrand: "请选择品牌 / 系列",
      back: "返回",
      copyBtn: "复制总单",
      sendBtn: "发送 WhatsApp",
      inStock: "有货 IN STOCK",
      soldOut: "售罄 SOLD OUT",
      rmaTitle: "退换货 / 保修申请 (RMA)",

      emptyCartAlert: "请先选择至少一件商品",
      copiedToast: "总单清单已复制，可直接粘贴发送！",
      claimCopiedToast: "保修单已复制，可直接粘贴发送！"
    }
  };

  /* ================= 初始商品分类骨架 ================= */
  const defaultCatalog = [
    {
      id: "eliquid",
      badge: "EL",
      warrantyEnabled: true,
      title: { en: "E-Liquid / Flavors", bm: "E-Liquid / Perisa", zh: "E-Liquid / 烟油口味" },
      desc: { en: "Freebase & Saltnic wholesale series", bm: "Koleksi borong Freebase & Saltnic", zh: "小烟与大烟全系列批发口味" },
      brands: [
        {
          id: "unplug",
          name: "UNPLUG",
          desc: "15ml / 30ml · Saltnic & Freebase",
          products: [
            { id: "UP-01", name: "01 - MANGO", spec: "Nicotine: 3% · Freebase", inStock: true },
            { id: "UP-02", name: "02 - GRAPE", spec: "Nicotine: 3% · Freebase", inStock: true },
            { id: "UP-03", name: "03 - LYCHEE ICE", spec: "Nicotine: 3% · Freebase", inStock: false }
          ]
        }
      ]
    },
    {
      id: "occ",
      badge: "OCC",
      warrantyEnabled: true,
      title: { en: "OCC / Cartridge", bm: "OCC / Katrij", zh: "OCC / 雾化芯与空烟弹" },
      desc: { en: "Replacement pods, cartridges & coils", bm: "Pod gantian, katrij & coil", zh: "各品牌替换空烟弹与雾化芯" },
      brands: [
        {
          id: "occ-main",
          name: "UNIVERSAL POD / COIL",
          desc: "0.6Ω / 0.8Ω / 1.0Ω Replacement",
          products: [
            { id: "OC-01", name: "0.6Ω MESH CARTRIDGE (3pcs/box)", spec: "3ml · Top Fill", inStock: true },
            { id: "OC-02", name: "0.8Ω MESH CARTRIDGE (3pcs/box)", spec: "3ml · Top Fill", inStock: true }
          ]
        }
      ]
    },
    {
      id: "device",
      badge: "DV",
      warrantyEnabled: true,
      title: { en: "Device (Pod / Kit Set)", bm: "Peranti (Pod / Kit Set)", zh: "Device / 主机与套装" },
      desc: { en: "Pod systems, devices & starter kit sets", bm: "Sistem pod, peranti & set permulaan", zh: "Pod 主机、杆子与完整套装" },
      brands: [
        {
          id: "dev-main",
          name: "5K STARTER KIT",
          desc: "Type-C Fast Charge · Aluminum Alloy",
          products: [
            { id: "DV-01", name: "PRO POD DEVICE - OBSIDIAN BLACK", spec: "1000mAh · Kit Set", inStock: true },
            { id: "DV-02", name: "PRO POD DEVICE - CHAMPAGNE GOLD", spec: "1000mAh · Kit Set", inStock: true }
          ]
        }
      ]
    }
  ];

  /* ================= 本地持久化状态加载 ================= */
  let currentLang = localStorage.getItem('5k_lang') || 'en';
  let catalogData = loadCatalogData();
  let rmaGlobalEnabled = JSON.parse(localStorage.getItem('5k_rma_global') ?? 'true');
  let nextInvNum = Math.max(CONFIG.START_INVOICE_NUM, parseInt(localStorage.getItem('5k_next_inv') || CONFIG.START_INVOICE_NUM, 10));
  let nextClaimNum = Math.max(CONFIG.START_CLAIM_NUM, parseInt(localStorage.getItem('5k_next_claim') || CONFIG.START_CLAIM_NUM, 10));
  let orderHistory = JSON.parse(localStorage.getItem('5k_orders') || '[]');
  let claimHistory = JSON.parse(localStorage.getItem('5k_claims') || '[]');

  let viewState = 'categories'; // categories | brands | products | rma | admin
  let adminTab = 'stock';       // stock | claims
  let adminUnlocked = false;
  let activeCategory = null;
  let activeBrand = null;
  let searchQuery = '';
  let cart = {};
  let committedOrderInv = null; // 防止同一车重复点 Copy 与 WhatsApp 跳两次单号
  let committedCartSignature = '';
  let logoTapCount = 0;
  let logoTapTimer = null;

  function loadCatalogData() {
    const savedStock = JSON.parse(localStorage.getItem('5k_stock_map') || '{}');
    const savedCatWarranty = JSON.parse(localStorage.getItem('5k_cat_warranty') || '{}');
    const cloned = JSON.parse(JSON.stringify(defaultCatalog));
    cloned.forEach(cat => {
      if (typeof savedCatWarranty[cat.id] === 'boolean') {
        cat.warrantyEnabled = savedCatWarranty[cat.id];
      }
      cat.brands.forEach(b => {
        b.products.forEach(p => {
          if (typeof savedStock[p.id] === 'boolean') {
            p.inStock = savedStock[p.id];
          }
        });
      });
    });
    return cloned;
  }

  function persistStockAndWarranty() {
    const stockMap = {};
    const catWarranty = {};
    catalogData.forEach(cat => {
      catWarranty[cat.id] = cat.warrantyEnabled;
      cat.brands.forEach(b => {
        b.products.forEach(p => {
          stockMap[p.id] = p.inStock;
        });
      });
    });
    localStorage.setItem('5k_stock_map', JSON.stringify(stockMap));
    localStorage.setItem('5k_cat_warranty', JSON.stringify(catWarranty));
    localStorage.setItem('5k_rma_global', JSON.stringify(rmaGlobalEnabled));
  }

  /* ================= 日期与单号格式化 ================= */
  function getTodayFormatted() {
    const now = new Date();
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yyyy = now.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }

  function formatInvoiceId(num) {
    return 'INV-' + String(num).padStart(6, '0');
  }

  function formatClaimId(num) {
    return 'CLAIM-' + String(num).padStart(5, '0');
  }

  function getActiveDisplayInvoiceId() {
    const sig = getCartSignature();
    if (committedOrderInv && sig && sig === committedCartSignature) {
      return committedOrderInv;
    }
    return formatInvoiceId(nextInvNum);
  }

  function getCartSignature() {
    const keys = Object.keys(cart).sort();
    if (keys.length === 0) return '';
    return keys.map(k => `${k}:${cart[k].qty}`).join('|');
  }

  /* ================= 提示框与剪贴板工具 ================= */
  function showToast(msg) {
    const el = document.getElementById('toast-msg');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  async function copyTextToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  }

  /* ================= 语言与底部栏刷新 ================= */
  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('5k_lang', lang);
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + lang).classList.add('active');

    const t = i18n[currentLang];
    document.getElementById('ui-subtitle').textContent = viewState === 'admin' ? 'Admin Control · Instant Sync' : t.subtitle;
    document.getElementById('search-input').placeholder = t.searchPlaceholder;
    document.getElementById('ui-copy-btn').textContent = t.copyBtn;
    document.getElementById('ui-send-btn').textContent = t.sendBtn;
    updateBottomBar();
    renderView();
  }

  function updateBottomBar() {
    const items = Object.values(cart);
    const totalQty = items.reduce((sum, item) => sum + item.qty, 0);
    document.getElementById('bar-date').textContent = getTodayFormatted();
    document.getElementById('bar-inv').textContent = getActiveDisplayInvoiceId();
    document.getElementById('bar-cart-pill').textContent = totalQty > 0 ? `${totalQty} pcs ▾` : '0';
    document.getElementById('customer-footer').style.display = viewState === 'admin' ? 'none' : 'flex';
  }

  /* ================= 前台导航与加购逻辑 ================= */
  function handleSearch(val) {
    searchQuery = val.trim().toLowerCase();
    renderView();
  }

  function openCategory(catId) {
    activeCategory = catalogData.find(c => c.id === catId);
    viewState = 'brands';
    searchQuery = '';
    document.getElementById('search-input').value = '';
    renderView();
  }

  function openBrand(brandId) {
    activeBrand = activeCategory.brands.find(b => b.id === brandId);
    viewState = 'products';
    searchQuery = '';
    document.getElementById('search-input').value = '';
    renderView();
  }

  function openRmaModule() {
    viewState = 'rma';
    document.getElementById('search-wrapper').style.display = 'none';
    renderView();
  }

  function goBack() {
    if (viewState === 'products') {
      viewState = 'brands';
    } else {
      viewState = 'categories';
    }
    searchQuery = '';
    document.getElementById('search-input').value = '';
    document.getElementById('search-wrapper').style.display = 'block';
    renderView();
  }

  function findProductById(prodId) {
    for (const cat of catalogData) {
      for (const brand of cat.brands) {
        const found = brand.products.find(p => p.id === prodId);
        if (found) return { product: found, brand, category: cat };
      }
    }
    return null;
  }

  function changeQty(prodId, delta) {
    const info = findProductById(prodId);
    if (!info || !info.product.inStock) return;

    const current = cart[prodId] ? cart[prodId].qty : 0;
    const next = Math.max(0, current + delta);
    if (next === 0) {
      delete cart[prodId];
    } else {
      cart[prodId] = {
        id: prodId,
        name: info.product.name,
        brand: info.brand.name,
        qty: next
      };
    }
    // 购物车变化后解除旧单锁定
    if (getCartSignature() !== committedCartSignature) {
      committedOrderInv = null;
    }
    updateBottomBar();
    renderView();
  }

  /* ================= 极简 Ordered List 生成、复制总单与发送 WhatsApp ================= */
  function buildMinimalistOrderText() {
    const items = Object.values(cart);
    return items.map((item, idx) => `${idx + 1}. [${item.brand}] ${item.name} x ${item.qty}`).join('\n');
  }

  function commitOrderRecord() {
    const sig = getCartSignature();
    if (committedOrderInv && sig === committedCartSignature) {
      return committedOrderInv;
    }
    const assignedInv = formatInvoiceId(nextInvNum);
    const itemsSnapshot = Object.values(cart).map(i => ({ ...i }));
    orderHistory.unshift({
      invId: assignedInv,
      date: getTodayFormatted(),
      items: itemsSnapshot,
      totalQty: itemsSnapshot.reduce((s, x) => s + x.qty, 0)
    });
    localStorage.setItem('5k_orders', JSON.stringify(orderHistory));

    nextInvNum += 1;
    localStorage.setItem('5k_next_inv', String(nextInvNum));

    committedOrderInv = assignedInv;
    committedCartSignature = sig;
    updateBottomBar();
    return assignedInv;
  }

  async function copyOrderList() {
    const items = Object.values(cart);
    if (items.length === 0) {
      alert(i18n[currentLang].emptyCartAlert);
      return;
    }
    const invId = commitOrderRecord();
    const orderText = buildMinimalistOrderText();
    await copyTextToClipboard(orderText);
    showToast(`${i18n[currentLang].copiedToast} (${invId})`);
    updateCartModalIfOpen();
  }

  function sendWhatsAppOrder() {
    const items = Object.values(cart);
    if (items.length === 0) {
      alert(i18n[currentLang].emptyCartAlert);
      return;
    }
    commitOrderRecord();
    const orderText = buildMinimalistOrderText();
    const url = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(orderText)}`;
    window.open(url, '_blank');

    // 发送后清空当前购物车并准备下一张单号
    cart = {};
    committedOrderInv = null;
    committedCartSignature = '';
    closeCartModal();
    updateBottomBar();
    renderView();
  }

  /* ================= 总单预览弹窗 ================= */
  function openCartModal() {
    updateCartModalContent();
    document.getElementById('cart-modal').classList.add('open');
  }

  function closeCartModal(e) {
    if (!e || e.target.id === 'cart-modal') {
      document.getElementById('cart-modal').classList.remove('open');
    }
  }

  function updateCartModalIfOpen() {
    if (document.getElementById('cart-modal').classList.contains('open')) {
      updateCartModalContent();
    }
  }

  function updateCartModalContent() {
    document.getElementById('modal-date-top').textContent = getTodayFormatted();
    document.getElementById('modal-inv-bottom').textContent = getActiveDisplayInvoiceId();
    const body = document.getElementById('cart-modal-body');
    const items = Object.values(cart);
    if (items.length === 0) {
      body.innerHTML = `<div class="card-desc" style="padding:14px 0;">No items selected yet.</div>`;

    cart = {};
    committedOrderInv = null;
    committedCartSignature = '';
    closeCartModal();
    updateBottomBar();
    renderView();

  /* ================= 保修申请 (CLAIM-00001) 逻辑 ================= */
  function autoFillInvoiceItems(invInputVal) {
    const clean = invInputVal.trim().toUpperCase();
    const hintBox = document.getElementById('inv-match-hint');
    if (!hintBox) return;
    if (!clean) {
      hintBox.innerHTML = `<span style="color:var(--text-muted);">No Invoice entered — will be saved directly under <b>${formatClaimId(nextClaimNum)}</b> as standalone warranty proof.</span>`;
      return;
    }
    const matchedOrder = orderHistory.find(o => o.invId.toUpperCase() === clean);
    const existingClaims = claimHistory.filter(c => c.invId.toUpperCase() === clean);
    if (matchedOrder) {
      const itemsStr = matchedOrder.items.map(i => `[${i.brand}] ${i.name} x${i.qty}`).join(', ');
      const claimWarn = existingClaims.length > 0
        ? `<div style="color:#B45309;margin-top:3px;">⚠️ Existing Claim(s) on this Invoice: ${existingClaims.map(c => c.claimId).join(', ')}</div>`
        : `<div style="color:var(--stock-green);margin-top:3px;">✓ Verified Order (${matchedOrder.date}) · No prior claim</div>`;
      hintBox.innerHTML = `<div style="background:#F0FDF4;border:1px solid #BBF7D0;padding:8px 10px;border-radius:8px;margin-top:6px;font-size:11.5px;"><b>Order Items:</b> ${itemsStr}${claimWarn}</div>`;
    } else {
      hintBox.innerHTML = `<span style="color:var(--navy-light);font-size:11.5px;">Invoice <b>${clean}</b> will be linked to <b>${formatClaimId(nextClaimNum)}</b>.</span>`;
    }
  }

  function saveClaimFromForm() {
    const invVal = (document.getElementById('rma-inv-input')?.value || '').trim().toUpperCase();
    const catVal = document.getElementById('rma-cat-select')?.value || 'General';
    const itemsVal = (document.getElementById('rma-items-input')?.value || '').trim();
    const reasonVal = (document.getElementById('rma-reason-input')?.value || '').trim();

    if (!itemsVal) {
      alert(currentLang === 'zh' ? '请填写需要保修的单品名称与数量' : 'Please enter the warranty item(s) and quantity.');
      return null;
    }

    const claimId = formatClaimId(nextClaimNum);
    const record = {
      claimId,
      invId: invVal, // 为空代表没订货/无关联单号，直接跟 CLAIM 流水号保存证据
      date: getTodayFormatted(),
      category: catVal,
      items: itemsVal,
      reason: reasonVal || 'Warranty / Defective Return',
      status: 'pending' // pending | done | rejected
    };

    claimHistory.unshift(record);
    localStorage.setItem('5k_claims', JSON.stringify(claimHistory));

    nextClaimNum += 1;
    localStorage.setItem('5k_next_claim', String(nextClaimNum));
    return record;
  }

  function formatClaimMessage(rec) {
    const invLine = rec.invId ? `Invoice: ${rec.invId}` : `Invoice: N/A (Standalone Claim)`;
    return `${rec.date}\n${rec.claimId}\n${invLine}\nCategory: ${rec.category}\nItems: ${rec.items}\nIssue: ${rec.reason}`;
  }

  async function handleClaimCopy() {
    const rec = saveClaimFromForm();
    if (!rec) return;
    await copyTextToClipboard(formatClaimMessage(rec));
    showToast(`${i18n[currentLang].claimCopiedToast} (${rec.claimId})`);
    renderView();
  }

  function handleClaimWhatsApp() {
    const rec = saveClaimFromForm();
    if (!rec) return;
    const url = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(formatClaimMessage(rec))}`;
    window.open(url, '_blank');
    renderView();
  }

  function lookupClaimOrInv() {
    const q = (document.getElementById('rma-lookup-input')?.value || '').trim().toUpperCase();
    const box = document.getElementById('rma-lookup-result');
    if (!q || !box) return;

    const foundClaims = claimHistory.filter(c => c.claimId.toUpperCase() === q || (c.invId && c.invId.toUpperCase() === q));
    if (foundClaims.length === 0) {
      box.innerHTML = `<div class="card-desc" style="margin-top:8px;color:var(--text-muted);">No warranty claim record found for <b>${q}</b>.</div>`;
      return;
    }
    box.innerHTML = foundClaims.map(c => {
      const stLabel = c.status === 'done' ? 'APPROVED / COMPLETED' : c.status === 'rejected' ? 'REJECTED' : 'PENDING REVIEW';
      return `
        <div style="background:#F8FAFC;border:1px solid var(--gold-border);border-radius:9px;padding:10px;margin-top:8px;font-size:12px;">
          <div style="font-weight:800;color:var(--navy-main);">${c.claimId} · <span style="color:var(--gold-primary);">${stLabel}</span></div>
          <div style="margin-top:3px;">Date: ${c.date} | Ref: ${c.invId || 'No Invoice (Standalone)'}</div>
          <div style="margin-top:3px;">Items: <b>${c.items}</b></div>
        </div>
      `;
    }).join('');
  }

  /* ================= Admin 一步到位后台控制 ================= */
  function handleLogoTap() {
    logoTapCount += 1;
    clearTimeout(logoTapTimer);
    logoTapTimer = setTimeout(() => { logoTapCount = 0; }, 900);
    if (logoTapCount >= 3) {
      logoTapCount = 0;
      toggleAdminAccess();
    }
  }

  function toggleAdminAccess() {
    if (viewState === 'admin') {
      viewState = 'categories';
      document.getElementById('admin-mode-btn').classList.remove('active-mode');
      document.getElementById('admin-btn-label').textContent = '🔒 Admin';
      document.getElementById('ui-main-title').innerHTML = '5K Wholesale<br>Self-Order';
      document.getElementById('search-wrapper').style.display = 'block';
      updateBottomBar();
      renderView();
      return;
    }
    if (adminUnlocked) {
      enterAdminMode();
    } else {
      document.getElementById('admin-pin-input').value = '';
      document.getElementById('pin-modal').classList.add('open');
      setTimeout(() => document.getElementById('admin-pin-input').focus(), 80);
    }
  }

  function closePinModal(e) {
    if (!e || e.target.id === 'pin-modal') {
      document.getElementById('pin-modal').classList.remove('open');
    }
  }

  function verifyAdminPin() {
    const val = document.getElementById('admin-pin-input').value.trim();
    if (val === CONFIG.ADMIN_PIN) {
      adminUnlocked = true;
      closePinModal();
      enterAdminMode();
    } else {
      alert('Incorrect PIN!');

  function enterAdminMode() {
    viewState = 'admin';
    searchQuery = '';
    document.getElementById('search-input').value = '';
    document.getElementById('search-wrapper').style.display = 'block';
    document.getElementById('admin-mode-btn').classList.add('active-mode');

    document.getElementById('ui-main-title').innerHTML = '5K Admin<br>Dashboard';
    document.getElementById('ui-subtitle').textContent = 'One-Click Stock & Claim Control';
    updateBottomBar();
    renderView();

    adminTab = tab;
    renderView();
  }

  // 一键切换单品库存（即时生效，无需点保存）
  function instantToggleStock(prodId) {
    const info = findProductById(prodId);
    if (!info) return;
    info.product.inStock = !info.product.inStock;
    if (!info.product.inStock && cart[prodId]) {
      delete cart[prodId];
    }
    persistStockAndWarranty();
    showToast(`${info.product.name}: ${info.product.inStock ? 'IN STOCK' : 'SOLD OUT'}`);
    renderView();
  }

  // 一键切换首页 RMA 总入口
  function instantToggleGlobalRma() {
    rmaGlobalEnabled = !rmaGlobalEnabled;
    persistStockAndWarranty();
    showToast(`Homepage RMA Entry: ${rmaGlobalEnabled ? 'ON' : 'OFF'}`);
    renderView();
  }

  // 一键切换各分类保修权限
  function instantToggleCategoryWarranty(catId) {
    const cat = catalogData.find(c => c.id === catId);
    if (!cat) return;
    cat.warrantyEnabled = !cat.warrantyEnabled;
    persistStockAndWarranty();
    showToast(`${cat.title.en} Warranty: ${cat.warrantyEnabled ? 'ON' : 'OFF'}`);
    renderView();
  }

  // 一键切换保修单处理状态
  function cycleClaimStatus(claimId) {
    const rec = claimHistory.find(c => c.claimId === claimId);
    if (!rec) return;
    const order = ['pending', 'done', 'rejected'];
    rec.status = order[(order.indexOf(rec.status) + 1) % order.length];
    localStorage.setItem('5k_claims', JSON.stringify(claimHistory));
    renderView();
  }

  // 后台工作人员快速登记保修证据
  function quickStaffLogClaim() {
    const invVal = (document.getElementById('staff-claim-inv')?.value || '').trim().toUpperCase();
    const itemsVal = (document.getElementById('staff-claim-items')?.value || '').trim();
    const reasonVal = (document.getElementById('staff-claim-reason')?.value || '').trim();
    if (!itemsVal) {
      alert('Please enter product name & qty for claim proof.');
      return;
    }
    const claimId = formatClaimId(nextClaimNum);
    claimHistory.unshift({
      claimId,
      invId: invVal,
      date: getTodayFormatted(),
      category: 'Staff Logged',
      items: itemsVal,
      reason: reasonVal || 'Staff Warranty Proof',
      status: 'done'
    });
    localStorage.setItem('5k_claims', JSON.stringify(claimHistory));
    nextClaimNum += 1;
    localStorage.setItem('5k_next_claim', String(nextClaimNum));
    showToast(`Saved under ${claimId}!`);
    renderView();
  }

            </button>
            <button class="wa-order-btn" onclick="handleClaimWhatsApp()">
              <svg viewBox="0 0 24 24">
                <path d="M12.031 2c-5.506 0-9.987 4.478-9.989 9.984a9.964 9.964 0 0 0 1.333 4.993L2 22l5.233-1.237a9.994 9.994 0 0 0 4.793 1.217h.004c5.505 0 9.986-4.478 9.988-9.984 0-2.668-1.037-5.176-2.922-7.062A9.935 9.935 0 0 0 12.031 2zm5.824 14.12c-.245.688-1.421 1.318-1.976 1.402-.508.076-1.15.109-1.856-.116-.428-.136-.979-.318-1.685-.622-2.964-1.28-4.9-4.265-5.048-4.462-.147-.197-1.206-1.605-1.206-3.062 0-1.456.763-2.172 1.034-2.468.271-.296.591-.37.788-.37.197 0 .394.002.566.01.182.009.426-.069.666.508.246.592.837 2.047.911 2.195.074.148.123.321.025.518-.099.198-.148.321-.296.494-.148.173-.311.386-.444.518-.148.148-.302.309-.13.605.173.296.766 1.264 1.645 2.048 1.13.1008 2.083 1.32 2.379 1.468.296.148.468.123.641-.074.173-.197.739-.863.936-1.159.197-.296.394-.247.665-.148.271.099 1.724.813 2.02.961.295.148.492.222.566.345.074.123.074.715-.171 1.403z"/>
              </svg>
              <span>Send Claim</span>
            </button>
          </div>
        </div>

        <div class="gold-card">
          <div class="form-label">Check Claim / Invoice Warranty Status</div>
          <div style="display:flex;gap:8px;">
            <input type="text" id="rma-lookup-input" class="form-control" placeholder="Enter CLAIM-00001 or INV-000051">
            <button class="back-btn" style="background:var(--navy-main);color:#FFF;border-color:var(--navy-main);" onclick="lookupClaimOrInv()">Check</button>
          </div>
          <div id="rma-lookup-result"></div>
        </div>
      `;
      container.innerHTML = html;
      return;
    }

    /* -------- 3. 前台全局搜索或分类层级视图 -------- */
    if (viewState === 'categories' && searchQuery) {
      html += `
        <div class="nav-header">
          <div>
            <div class="section-label">SEARCH RESULTS</div>
            <div class="section-heading">"${searchQuery}"</div>
          </div>
        </div>
      `;
      let foundAny = false;
      catalogData.forEach(cat => {
        cat.brands.forEach(brand => {
          brand.products.forEach(prod => {
            if (
              prod.name.toLowerCase().includes(searchQuery) ||
              brand.name.toLowerCase().includes(searchQuery) ||
              cat.title[currentLang].toLowerCase().includes(searchQuery)
            ) {
              foundAny = true;
              html += renderProductCardHtml(prod, brand.name, t);
            }
          });
        });
      });
      if (!foundAny) {
        html += `<div class="gold-card"><div class="card-desc">No matching items found.</div></div>`;
      }
      container.innerHTML = html;
      return;
    }

    if (viewState === 'categories') {
      html += `
        <div class="nav-header">
          <div>
            <div class="section-label">${t.allCategories}</div>
            <div class="section-heading">${t.selectCategory}</div>
          </div>
        </div>
      `;

      catalogData.forEach(cat => {
        html += `
          <div class="gold-card clickable" onclick="openCategory('${cat.id}')">
            <div class="card-left">
              <div class="cat-badge">${cat.badge}</div>
              <div>
                <div class="card-title">${cat.title[currentLang]}</div>
                <div class="card-desc">${cat.desc[currentLang]}</div>
              </div>
            </div>
            <div class="chevron">›</div>
          </div>
        `;
      });

      if (rmaGlobalEnabled) {
        html += `
          <div class="gold-card clickable rma-card" onclick="openRmaModule()">
            <div class="card-left">
              <div class="cat-badge" style="background:linear-gradient(145deg,#1E3A8A,#0F2537);">🛡️</div>
              <div>
                <div class="card-title">${t.rmaTitle}</div>
                <div class="card-desc">${t.rmaDesc}</div>
              </div>
            </div>
            <div class="chevron">›</div>
          </div>
        `;
      }
    } else if (viewState === 'brands') {
      html += `
        <div class="nav-header">
          <div>
            <div class="section-label">${activeCategory.title[currentLang]}</div>
            <div class="section-heading">${t.selectBrand}</div>
          </div>
          <button class="back-btn" onclick="goBack()">‹ ${t.back}</button>
        </div>
      `;

      activeCategory.brands
        .filter(b => b.name.toLowerCase().includes(searchQuery))
        .forEach(brand => {
          html += `
            <div class="gold-card clickable" onclick="openBrand('${brand.id}')">
              <div class="card-left">
                <div class="cat-badge">${brand.name.substring(0, 2).toUpperCase()}</div>
                <div>
                  <div class="card-title">${brand.name}</div>
                  <div class="card-desc">${brand.desc}</div>
                </div>
              </div>
              <div class="chevron">›</div>
            </div>
          `;
        });
    } else if (viewState === 'products') {
      html += `
        <div class="nav-header">
          <div>
            <div class="section-label">${activeCategory.title[currentLang]}</div>
            <div class="section-heading">${activeBrand.name}</div>
          </div>
          <button class="back-btn" onclick="goBack()">‹ ${t.back}</button>
        </div>
      `;

      const filteredProducts = activeBrand.products.filter(p => p.name.toLowerCase().includes(searchQuery));
      if (filteredProducts.length === 0) {
        html += `<div class="gold-card"><div class="card-desc">No items found under this brand.</div></div>`;
      } else {
        filteredProducts.forEach(prod => {
          html += renderProductCardHtml(prod, activeBrand.name, t);
        });
      }
    }

    container.innerHTML = html;
  }

  function renderProductCardHtml(prod, brandName, t) {
    const qty = cart[prod.id] ? cart[prod.id].qty : 0;
    const isOut = !prod.inStock;
    return `
      <div class="gold-card product-card ${isOut ? 'sold-out' : ''}">
        <div>
          <div style="font-size:10.5px;font-weight:800;color:var(--gold-primary);margin-bottom:2px;">${brandName}</div>
          <div class="card-title">${prod.name}</div>
          <div class="card-desc">${prod.spec}</div>
          <span class="stock-badge ${isOut ? 'out' : 'in'}">${isOut ? t.soldOut : t.inStock}</span>
        </div>
        <div class="qty-panel ${isOut ? 'disabled-controls' : ''}">
          <div class="bulk-btns">
            <button class="bulk-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', 5)">+5</button>
            <button class="bulk-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', 10)">+10</button>
          </div>
          <div class="step-btns">
            <button class="step-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', -1)">−</button>
            <span class="qty-num">${qty}</span>
            <button class="step-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', 1)">+</button>
          </div>
        </div>
      </div>
    `;
  }

  /* 初始化启动 */
  setLanguage(currentLang);
</script>
</body>
</html>
