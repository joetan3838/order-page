  <!-- 5K 桌面专属黑金 App 图腾与全屏配置（独立模块，不影响任何下单功能） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="5K Order">
  <meta name="application-name" content="5K Order">
  <meta name="theme-color" content="#081726">
  <script>
    (function() {
      try {
        var c = document.createElement('canvas');
        c.width = 512; c.height = 512;
        var ctx = c.getContext('2d');

        var bg = ctx.createLinearGradient(0, 0, 512, 512);
        bg.addColorStop(0, '#16334D');
        bg.addColorStop(0.5, '#0B1D2E');
        bg.addColorStop(1, '#050E17');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, 512, 512);

        var gold = ctx.createLinearGradient(60, 40, 452, 472);
        gold.addColorStop(0, '#FFF8D6');
        gold.addColorStop(0.28, '#E5C168');
        gold.addColorStop(0.55, '#9B6E1B');
        gold.addColorStop(0.8, '#FCE394');
        gold.addColorStop(1, '#6E4B0C');

        ctx.beginPath();
        ctx.arc(256, 256, 214, 0, Math.PI * 2);
        ctx.lineWidth = 22;
        ctx.strokeStyle = gold;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(256, 256, 184, 0, Math.PI * 2);
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'rgba(255, 243, 196, 0.75)';
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '900 182px -apple-system, BlinkMacSystemFont, "Arial Black", sans-serif';
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillText('5K', 256, 242);

        ctx.fillStyle = gold;
        ctx.fillText('5K', 256, 232);

        ctx.font = '800 44px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillStyle = '#EAD296';
        ctx.fillText('TRADING', 256, 358);

        var iconData = c.toDataURL('image/png');

        ['apple-touch-icon', 'icon'].forEach(function(rel) {
          var link = document.createElement('link');
          link.rel = rel;
          link.href = iconData;
          document.head.appendChild(link);
        });

        var manifest = {
          name: '5K Wholesale Self-Order',
          short_name: '5K Order',
          start_url: window.location.href.split('#')[0],
          display: 'standalone',
          background_color: '#081726',
          theme_color: '#081726',
          icons: [{ src: iconData, sizes: '512x512', type: 'image/png' }]
        };
        var mLink = document.createElement('link');
        mLink.rel = 'manifest';
        mLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
        document.head.appendChild(mLink);
      } catch (e) {}
    })();
  </script>

  <style>

  function getDraftOrderId() {
    if (!draftOrderId) {
      const d = new Date(), p = x => String(x).padStart(2, '0');
      const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      let rnd = ''; for (let i = 0; i < 4; i++) rnd += abc[Math.floor(Math.random() * abc.length)];
      draftOrderId = `INV-${String(d.getFullYear()).slice(2)}${p(d.getMonth() + 1)}${p(d.getDate())}-${rnd}`;
    }
    return draftOrderId;
  }

    lsSet('5k_cart_v2', plain);
    if (Object.keys(cart).length) { getDraftOrderId(); lsSet('5k_draft_id', draftOrderId); }
    else if (!committedOrderInv) { draftOrderId = null; lsSet('5k_draft_id', null); }

  function saveLastOrder(invId) {
    const items = Object.values(cart).filter(i => !i.isPhoto).map(i => ({ id: i.id, name: i.name, brand: i.brand, qty: i.qty }));
    if (!items.length) return;
    lastOrder = { invId, date: getTodayFormatted(), items, totalQty: items.reduce((s, i) => s + i.qty, 0) };
    lsSet('5k_last_order', lastOrder);
  }
  function reorderLast() {
    if (!lastOrder) return;
    const t = i18n[currentLang]; let added = 0, skipped = 0;
    lastOrder.items.forEach(it => {
      const info = findProductById(it.id);
      if (!info || !info.product.inStock) { skipped++; return; }
      cart[it.id] = { id: it.id, name: info.product.name, brand: info.brand.name, qty: (cart[it.id] ? cart[it.id].qty : 0) + it.qty }; added++;
    });
    committedOrderInv = null;
    updateBottomBar(); renderView();
    showToast(t.reorderDone(added) + (skipped ? ' · ' + t.reorderSkip(skipped) : ''));

  function loadCatalogData() {
    const cloudCache = localStorage.getItem('5k_cloud_stock');

    const savedCatWarranty = JSON.parse(localStorage.getItem('5k_cat_warranty') || '{}');
    const cloned = JSON.parse(JSON.stringify(defaultCatalog));

    const origOccIdx = cloned.findIndex(c => c.id === 'occ');
    if (origOccIdx !== -1) {
      cloned[origOccIdx].badge = 'PF';
      cloned[origOccIdx].title = { en: "Prefilled Cartridge", bm: "Prefilled Cartridge / Katrij Berperisa", zh: "Prefilled Cartridge / 预注油烟弹" };

    }
    if (!cloned.some(c => c.id === 'occ_empty')) {
      const insertAt = origOccIdx !== -1 ? origOccIdx + 1 : 2;
      cloned.splice(insertAt, 0, {
        id: "occ_empty",

        warrantyEnabled: true,
        title: { en: "OCC / Empty Cartridge", bm: "OCC / Katrij Kosong", zh: "OCC / 雾化芯与空烟弹" },

  async function copyTextToClipboard(text) {

        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';

        document.execCommand('copy'); document.body.removeChild(ta);

    } catch (e) {}
  }

  function dataUrlToFile(dataUrl, filename) {
    const arr = dataUrl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) u8arr[n] = bstr.charCodeAt(n);
    return new File([u8arr], filename, { type: mime });
  }

  function changeQty(prodId, delta) {
    if (cart[prodId] && cart[prodId].isPhoto) {
      const next = Math.max(0, cart[prodId].qty + delta);
      if (next === 0) {
        delete cart[prodId];
      } else {
        cart[prodId].qty = next;
        prepareStampedPhotoForCartItem(prodId);
      }
      if (getCartSignature() !== committedCartSignature) committedOrderInv = null;
      updateBottomBar(); updateCartModalIfOpen(); renderView();
      return;
    }
    const info = findProductById(prodId);
    if (!info || !info.product.inStock) return;
    const current = cart[prodId] ? cart[prodId].qty : 0;
    const next = Math.max(0, current + delta);
    if (next === 0) delete cart[prodId];
    else cart[prodId] = { id: prodId, name: info.product.name, brand: info.brand.name, qty: next };
    if (getCartSignature() !== committedCartSignature) committedOrderInv = null;
    updateBottomBar(); updateCartModalIfOpen(); renderView();
  }

  /* ================= 醒目大字号数量水印（员工在聊天框里不用点开大图也能看清数量） ================= */
  function stampPhotoWithLabel(dataUrl, itemTitle, qtyNum) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const barH = Math.max(54, Math.round(img.height * 0.12));
        const yTop = img.height - barH;

        ctx.fillStyle = 'rgba(8, 23, 38, 0.90)';
        ctx.fillRect(0, yTop, img.width, barH);
        ctx.fillStyle = '#E5C168';
        ctx.fillRect(0, yTop, img.width, Math.max(3, Math.round(barH * 0.07)));

        const fontSize = Math.max(22, Math.round(barH * 0.52));
        ctx.font = `800 ${fontSize}px sans-serif`;
        ctx.textBaseline = 'middle';

        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(itemTitle, Math.round(img.width * 0.04), yTop + barH / 2 + 2);

        const qtyStr = `x ${qtyNum} PCS`;
        const qtyW = ctx.measureText(qtyStr).width;
        ctx.fillStyle = '#FFE89E';
        ctx.fillText(qtyStr, Math.max(Math.round(img.width * 0.45), img.width - qtyW - Math.round(img.width * 0.04)), yTop + barH / 2 + 2);

        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  }

    }
  }

  /* ================= 品牌抬头清爽订单汇总（无任何杂乱链接） ================= */
  function buildMinimalistOrderText() {
    const items = Object.values(cart);
    if (items.length === 0) return '';
    const grouped = [], brandMap = new Map();
    items.forEach(item => {
      if (!brandMap.has(item.brand)) {
        const block = { brand: item.brand, lines: [] };
        brandMap.set(item.brand, block);
        grouped.push(block);
      }
      brandMap.get(item.brand).lines.push(`${String(item.name).replace(/^\s*\d+\s*[-–]\s*/, '')} x ${item.qty}`);
    });
    const blocksText = grouped.map(g => `${g.brand}\n\n${g.lines.join('\n')}`).join('\n\n\n');
    const totalTypes = items.length;
    const totalQty = items.reduce((sum, i) => sum + i.qty, 0);
    const now = new Date();
    const hhmm = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    const head = `*5K WHOLESALE ORDER*\n${getActiveDisplayInvoiceId()} · ${getTodayFormatted()} ${hhmm}\nShop: ${shopName || '-'}\n────────────`;
    return `${head}\n\n${blocksText}\n\nTotal: ${totalTypes} types · ${totalQty} pcs`;
  }

  function commitOrderRecord() {
    const sig = getCartSignature();
    if (committedOrderInv && sig === committedCartSignature) return committedOrderInv;
    const assignedInv = getDraftOrderId();
    orderHistory = orderHistory.filter(o => o.invId !== assignedInv);
    const itemsSnapshot = Object.values(cart).map(i => ({ id: i.id, name: i.name, brand: i.brand, qty: i.qty }));
    orderHistory.unshift({ invId: assignedInv, shop: shopName, date: getTodayFormatted(), items: itemsSnapshot, totalQty: itemsSnapshot.reduce((s, x) => s + x.qty, 0) });
    localStorage.setItem('5k_orders_v1', JSON.stringify(orderHistory));
    nextInvNum += 1;
    localStorage.setItem('5k_inv_seq_v1', String(nextInvNum));
    committedOrderInv = assignedInv; committedCartSignature = sig;
    queueSheetOrder({ action: 'order', inv: assignedInv, shop: shopName || '', ts: Date.now(),
      items: itemsSnapshot.map(x => ({ id: x.id, brand: x.brand || '', flavor: String(x.name || '').replace(/^\s*\d+\s*[-–]\s*/, ''), qty: x.qty })) });
    updateBottomBar();
    return assignedInv;
  }

  /* ================= 直接连带水印原图发送（无网页中间弹窗，零延迟调起图片附件） ================= */
  async function sendDirectWithPhotos(mode) {
    const t = i18n[currentLang];

    if (mode === 'order') {
      const items = Object.values(cart);
      if (items.length === 0) { alert(t.emptyCartAlert); return; }
      if (!ensureShopName()) return;

      const photoItems = items.filter(i => i.isPhoto && i.rawPhoto);
      for (const pi of photoItems) {
        if (!pi.stampedFile) await prepareStampedPhotoForCartItem(pi.id);
      }

      const invId = commitOrderRecord();
      const text = buildMinimalistOrderText();
      saveLastOrder(invId);
      const files = photoItems.map(pi => pi.stampedFile).filter(Boolean);

      // 有照片：直接发送带大号数量水印的图片原件 + 文字清单
      if (files.length > 0) {
        copyTextToClipboard(text);
        if (navigator.canShare && navigator.canShare({ files })) {
          try {
            await navigator.share({ files, text });
            cart = {}; committedOrderInv = null; committedCartSignature = ''; draftOrderId = null;
            closeCartModal(); updateBottomBar(); renderView();
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }
        // 电脑浏览器等不支持传图附件时：自动把水印原图下载到本地并打开 WhatsApp
        photoItems.forEach((pi, idx) => {
          setTimeout(() => downloadPhotoDataUrl(pi.stampedDataUrl || pi.rawPhoto, `${invId}-${pi.name.replace(/\s+/g, '')}-x${pi.qty}`), idx * 200);
        });
      }

      cart = {}; committedOrderInv = null; committedCartSignature = ''; draftOrderId = null;
      closeCartModal(); updateBottomBar(); renderView();
      window.location.href = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
      return;
    }

    if (mode === 'rma') {
      const rec = saveClaimFromForm();
      if (!rec) return;
      const text = formatClaimMessage(rec);
      const files = (rec.photos || []).map((src, idx) => dataUrlToFile(src, `${rec.claimId}-ITEM${idx + 1}.jpg`));
      renderView();

      if (files.length > 0 && navigator.canShare && navigator.canShare({ files })) {
        try {
          copyTextToClipboard(text);
          await navigator.share({ files, text });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      window.location.href = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
    }
  }

  function compressImageFile(file, addWarrantyStamp = true) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 920;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          if (addWarrantyStamp) {
            const barH = Math.max(36, Math.round(h * 0.08));
            ctx.fillStyle = 'rgba(8, 23, 38, 0.86)';
            ctx.fillRect(0, h - barH, w, barH);
            ctx.fillStyle = '#FFE89E';
            ctx.font = `800 ${Math.max(14, Math.round(barH * 0.48))}px sans-serif`;
            ctx.textBaseline = 'middle';
            ctx.fillText(`5K WARRANTY · ${getTodayFormatted()}`, Math.round(w * 0.04), h - barH / 2);
          }
          resolve(canvas.toDataURL('image/jpeg', 0.78));
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function autoFillInvoiceItems(invInputVal) {
    const t = i18n[currentLang];
    const clean = invInputVal.trim().toUpperCase();
    const hintBox = document.getElementById('inv-match-hint');
    if (!hintBox) return;
    if (!clean) {
      hintBox.innerHTML = `<span style="color:var(--text-muted);">${t.rmaInvEmptyHint(formatClaimId(nextClaimNum))}</span>`;
      return;
    }
    const matchedOrder = orderHistory.find(o => o.invId.toUpperCase() === clean);
    const existingClaims = claimHistory.filter(c => c.invId && c.invId.toUpperCase() === clean);
    if (matchedOrder) {
      const itemsStr = matchedOrder.items.map(i => `${i.brand} ${i.name} x${i.qty}`).join(', ');
      const claimWarn = existingClaims.length > 0
        ? `<div style="color:#B45309;margin-top:3px;">⚠️ Existing Claim(s): ${existingClaims.map(c => c.claimId).join(', ')}</div>`
        : `<div style="color:var(--stock-green);margin-top:3px;">✓ Verified (${matchedOrder.date})</div>`;
      hintBox.innerHTML = `<div style="background:#F0FDF4;border:1px solid #BBF7D0;padding:8px 10px;border-radius:8px;margin-top:6px;font-size:11.5px;"><b>Order:</b> ${itemsStr}${claimWarn}</div>`;
    } else {
      hintBox.innerHTML = `<span style="color:var(--navy-light);font-size:11.5px;">${t.rmaInvLinkedHint(clean, formatClaimId(nextClaimNum))}</span>`;
    }
  }

  function buildStructuredRmaItemsText() {
    const filledEntries = rmaClaimEntries
      .map((e, i) => ({ no: i + 1, item: (e.item || '').trim(), issue: (e.issue || '').trim(), hasPhoto: !!e.photo }))
      .filter(e => e.item || e.issue || e.hasPhoto);
    const extraText = (document.getElementById('rma-items-input')?.value || '').trim();
    if (filledEntries.length > 0) {
      const lines = filledEntries.map(e => {
        const label = e.item || `Warranty Item #${e.no}`;
        const issuePart = e.issue ? ` - ${e.issue}` : '';
        return `${e.no}. ${label}${issuePart}`;
      });
      if (extraText) lines.push(`Note: ${extraText}`);
      return lines.join('\n');
    }
    return extraText;
  }

  function saveClaimFromForm() {
    const t = i18n[currentLang];
    const invVal = (document.getElementById('rma-inv-input')?.value || '').trim().toUpperCase();
    const catVal = document.getElementById('rma-cat-select')?.value || 'General';
    const itemsVal = buildStructuredRmaItemsText();
    const reasonVal = (document.getElementById('rma-reason-input')?.value || '').trim();
    if (!itemsVal) { alert(t.rmaEmptyAlert); return null; }

    const photos = rmaClaimEntries.map(e => e.photo).filter(Boolean);
    const claimId = formatClaimId(nextClaimNum);
    const record = { claimId, invId: invVal, date: getTodayFormatted(), category: catVal, items: itemsVal, reason: reasonVal || 'Warranty / Defective Return', photos, status: 'pending' };
    claimHistory.unshift(record);
    safeSaveClaims();
    nextClaimNum += 1;
    localStorage.setItem('5k_next_claim', String(nextClaimNum));
    rmaClaimEntries = [];
    return record;
  }

  function formatClaimMessage(rec) {
    const invLine = rec.invId ? `Invoice: ${rec.invId}` : `Invoice: N/A (Standalone Claim)`;
    return `${rec.date}\n${rec.claimId}\n${invLine}\nCategory: ${rec.category}\n\nWARRANTY ITEMS:\n${rec.items}\n\nRemark: ${rec.reason}`;
  }

  async function handleClaimCopy() {
    const rec = saveClaimFromForm();
    if (!rec) return;
    await copyTextToClipboard(formatClaimMessage(rec));
    showToast(`${i18n[currentLang].claimCopiedToast} (${rec.claimId})`);
    renderView();

    const rec = claimHistory.find(c => c.claimId === claimId);

    openPhotoPreview(rec.photos[photoIdx], `${rec.claimId}-ITEM${photoIdx + 1}`);

    const t = i18n[currentLang];
    const q = (document.getElementById('rma-lookup-input')?.value || '').trim().toUpperCase();
    const box = document.getElementById('rma-lookup-result');

  async function verifyAdminPin() {
    const pin = document.getElementById('admin-pin-input').value.trim();
    if (!pin) return;
    let ok = false;
    try {
      const r = await fetch(CONFIG.SHEET_URL + '?action=auth&pin=' + encodeURIComponent(pin));

  function instantToggleStock(prodId) {
    const info = findProductById(prodId); if (!info) return;
    const p = info.product;
    p.inStock = !p.inStock;
    if (!p.inStock && cart[prodId]) delete cart[prodId];
    persistStockAndWarranty(); updateBottomBar();
    showToast(`${p.name}: ${p.inStock ? 'IN STOCK' : 'SOLD OUT'}`);
    renderView();
    sheetPost({ action: 'setStock', pin: adminPin, items: [{ id: p.id, brand: info.brand ? info.brand.name : '', name: p.name, inStock: p.inStock }] })
      .then(res => { if (!res.ok) throw new Error(res.error || 'fail'); cacheCloudStock(res.stock); })
      .catch(() => { p.inStock = !p.inStock; persistStockAndWarranty(); updateBottomBar(); renderView(); showToast('Sync failed, not saved. Check internet.'); });
  }

  /* ================= Google Sheets 云端（订单记录 + 库存同步） ================= */
  let adminPin = '';
  function sheetPost(body) {
    return fetch(CONFIG.SHEET_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(r => r.json());
  }
  function queueSheetOrder(payload) {
    const q = JSON.parse(localStorage.getItem('5k_sheet_queue') || '[]').filter(x => x.inv !== payload.inv);
    q.push(payload); localStorage.setItem('5k_sheet_queue', JSON.stringify(q));
    flushSheetQueue();
  }
  let sheetFlushing = false;
  async function flushSheetQueue() {
    if (sheetFlushing || !CONFIG.SHEET_URL) return; sheetFlushing = true;
    try {
      let q = JSON.parse(localStorage.getItem('5k_sheet_queue') || '[]');
      while (q.length) {
        const res = await sheetPost(q[0]);
        if (!res.ok) break;
        q = JSON.parse(localStorage.getItem('5k_sheet_queue') || '[]');
        q.shift(); localStorage.setItem('5k_sheet_queue', JSON.stringify(q));
      }
    } catch (e) {} finally { sheetFlushing = false; }
  }
  function cacheCloudStock(map) { if (map) localStorage.setItem('5k_cloud_stock', JSON.stringify(map)); }
  function applyCloudStock(map) {
    let changed = false;
    catalogData.forEach(cat => cat.brands.forEach(b => b.products.forEach(p => {
      if (typeof map[p.id] === 'boolean' && map[p.id] !== p.inStock) { p.inStock = map[p.id]; changed = true; }
      if (!p.inStock && cart[p.id]) { delete cart[p.id]; changed = true; }
    })));
    if (changed) { renderView(); updateBottomBar(); }
  }
  async function loadCloudStock() {
    if (!CONFIG.SHEET_URL) return;
    try {
      const r = await fetch(CONFIG.SHEET_URL + '?action=stock');
      const d = await r.json();
      if (d.ok && d.stock) { cacheCloudStock(d.stock); applyCloudStock(d.stock); }
    } catch (e) {}
  }
  function syncCatalogToSheet() {
    const items = [];
    catalogData.forEach(cat => cat.brands.forEach(b => b.products.forEach(p => items.push({ id: p.id, brand: b.name, name: p.name, inStock: p.inStock }))));
    sheetPost({ action: 'syncCatalog', pin: adminPin, items }).then(res => { if (res.ok) { cacheCloudStock(res.stock); applyCloudStock(res.stock); } }).catch(() => {});
  }
  window.addEventListener('load', () => { loadCloudStock(); flushSheetQueue(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { loadCloudStock(); flushSheetQueue(); } });
  function instantToggleGlobalRma() { rmaGlobalEnabled = !rmaGlobalEnabled; persistStockAndWarranty(); renderView(); }

  function cycleClaimStatus(claimId) {
    const rec = claimHistory.find(c => c.claimId === claimId); if (!rec) return;

    rec.status = order[(order.indexOf(rec.status) + 1) % order.length];

            </button>
            <button class="wa-order-btn" onclick="sendDirectWithPhotos('rma')">
              <svg viewBox="0 0 24 24"><path d="M12.031 2c-5.506 0-9.987 4.478-9.989 9.984a9.964 9.964 0 0 0 1.333 4.993L2 22l5.233-1.237a9.994 9.994 0 0 0 4.793 1.217h.004c5.505 0 9.986-4.478 9.988-9.984 0-2.668-1.037-5.176-2.922-7.062A9.935 9.935 0 0 0 12.031 2zm5.824 14.12c-.245.688-1.421 1.318-1.976 1.402-.508.076-1.15.109-1.856-.116-.428-.136-.979-.318-1.685-.622-2.964-1.28-4.9-4.265-5.048-4.462-.147-.197-1.206-1.605-1.206-3.062 0-1.456.763-2.172 1.034-2.468.271-.296.591-.37.788-.37.197 0 .394.002.566.01.182.009.426-.069.666.508.246.592.837 2.047.911 2.195.074.148.123.321.025.518-.099.198-.148.321-.296.494-.148.173-.311.386-.444.518-.148.148-.302.309-.13.605.173.296.766 1.264 1.645 2.048 1.13 1.008 2.083 1.32 2.379 1.468.296.148.468.123.641-.074.173-.197.739-.863.936-1.159.197-.296.394-.247.665-.148.271.099 1.724.813 2.02.961.295.148.492.222.566.345.074.123.074.715-.171 1.403z"/></svg>
              <span>${t.rmaSendBtn}</span>
            </button>
          </div>
        </div>

        <div class="gold-card">
          <div class="form-label">${t.rmaLookupLabel}</div>
          <div style="display:flex;gap:8px;">
            <input type="text" id="rma-lookup-input" class="form-control" placeholder="${t.rmaLookupPh}">
            <button class="back-btn" style="background:var(--navy-main);color:#FFF;border-color:var(--navy-main);" onclick="lookupClaimOrInv()">${t.rmaLookupBtn}</button>
          </div>
          <div id="rma-lookup-result"></div>
        </div>`;
      container.innerHTML = html;
      renderRmaPhotoGrid();
      return;
    }

    if (viewState === 'categories' && searchQuery) {
      html += `<div class="nav-header"><div><div class="section-label">${t.searchResults}</div><div class="section-heading">"${searchQuery}"</div></div><button class="main-menu-btn" onclick="goMainMenu()">${t.mainMenu}</button></div>`;
      let foundAny = false;
      catalogData.forEach(cat => cat.brands.forEach(brand => brand.products.forEach(prod => {
        if (prod.name.toLowerCase().includes(searchQuery) || brand.name.toLowerCase().includes(searchQuery) || cat.title[currentLang].toLowerCase().includes(searchQuery)) {
          foundAny = true;
          html += renderProductCardHtml(prod, brand.name, t);
        }
      })));
      if (!foundAny) html += `<div class="gold-card"><div class="card-desc">${t.noSearchMatch}</div></div>`;
      container.innerHTML = html;
      return;
    }

    if (viewState === 'categories') {
      html += `
        <div class="nav-header">
          <div style="min-width:0;">
            <div class="section-label">${t.allCategories}</div>
            <div class="section-heading">${t.selectCategory}</div>
          </div>
          <button type="button" class="quick-cam-btn" onclick="triggerQuickPhotoOrder()">${t.quickPhotoBtn}</button>
        </div>`;
      if (lastOrder && lastOrder.items && lastOrder.items.length) {
        html += `
          <div class="gold-card reorder-card">
            <div style="min-width:0;">
              <div class="section-label">${t.lastOrderTitle} · ${escHtml(lastOrder.date)}</div>
              <div class="card-title">${t.lastSummary(lastOrder.items.length, lastOrder.totalQty)}</div>
              <div class="card-desc reorder-list">${lastOrder.items.slice(0, 3).map(i => escHtml(i.name) + ' x ' + i.qty).join(' · ')}${lastOrder.items.length > 3 ? ' …' : ''}</div>
            </div>
            <button type="button" class="reorder-btn" onclick="reorderLast()">${t.reorderBtn}</button>
          </div>`;
      }
      catalogData.forEach(cat => {
        html += `
          <div class="gold-card clickable" onclick="openCategory('${cat.id}')">
            <div class="card-left">
              <div class="cat-badge">${cat.badge}</div>
              <div><div class="card-title">${cat.title[currentLang]}</div><div class="card-desc">${cat.desc[currentLang]}</div></div>
            </div>
            <div class="chevron">›</div>
          </div>`;
      });
      if (rmaGlobalEnabled) {
        html += `
          <div class="gold-card clickable rma-card" onclick="openRmaModule()">
            <div class="card-left">
              <div class="rma-3d-badge">${get3DRmaSpannerGearSvg()}</div>
              <div><div class="card-title">${get3DRedAlertExclamationSvg()} <span>${t.rmaTitle}</span></div><div class="card-desc">${t.rmaDescHtml}</div></div>
            </div>
            <div class="chevron">›</div>
          </div>`;
      }
    } else if (viewState === 'brands') {
      html += `
        <div class="nav-header">
          <div style="min-width:0;"><div class="section-label">${activeCategory.title[currentLang]}</div><div class="section-heading">${t.selectBrand}</div></div>
          <div class="nav-btn-group"><button class="main-menu-btn" onclick="goMainMenu()">${t.mainMenu}</button><button class="back-btn" onclick="goBack()">${t.back}</button></div>
        </div>`;
      const filteredBrands = activeCategory.brands.filter(b => b.name.toLowerCase().includes(searchQuery));
      if (filteredBrands.length === 0) {
        html += `<div class="gold-card"><div class="card-desc">${t.noItemsInBrand}</div></div>`;
      } else {
        filteredBrands.forEach(brand => {
          html += `
            <div class="gold-card clickable" onclick="openBrand('${brand.id}')">
              <div class="card-left">
                <div class="cat-badge">${brand.name.substring(0, 2).toUpperCase()}</div>
                <div><div class="card-title">${brand.name}</div><div class="card-desc">${brand.desc}</div></div>
              </div>
              <div class="chevron">›</div>
            </div>`;
        });
      }
    } else if (viewState === 'products') {
      html += `
        <div class="nav-header">
          <div style="min-width:0;"><div class="section-label">${activeCategory.title[currentLang]}</div><div class="section-heading">${activeBrand.name}</div></div>
          <div class="nav-btn-group"><button class="main-menu-btn" onclick="goMainMenu()">${t.mainMenu}</button><button class="back-btn" onclick="goBack()">${t.back}</button></div>
        </div>`;
      const filteredProducts = activeBrand.products.filter(p => p.name.toLowerCase().includes(searchQuery));
      if (filteredProducts.length === 0) html += `<div class="gold-card"><div class="card-desc">${t.noItemsInBrand}</div></div>`;
      else filteredProducts.forEach(prod => { html += renderProductCardHtml(prod, activeBrand.name, t); });
    }

    container.innerHTML = html;
  }

  function renderProductCardHtml(prod, brandName, t) {
    const qty = cart[prod.id] ? cart[prod.id].qty : 0;
    const isOut = !prod.inStock;
    return `
      <div class="gold-card product-card ${isOut ? 'sold-out' : ''}">
        <div>
          <div style="font-size:10.5px;font-weight:800;color:var(--gold-primary);margin-bottom:2px;">${brandName}</div>
          <div class="card-title">${prod.name}</div>
          <div class="card-desc">${prod.spec}</div>
          <span class="stock-badge ${isOut ? 'out' : 'in'}">${isOut ? t.soldOut : t.inStock}</span>
        </div>
        <div class="qty-panel ${isOut ? 'disabled-controls' : ''}">
          <div class="bulk-btns">
            <button class="bulk-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', 5)">+5</button>
            <button class="bulk-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', 10)">+10</button>
          </div>
          <div class="step-btns">
            <button class="step-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', -1)">−</button>
            <span class="qty-num">${qty}</span>
            <button class="step-btn" ${isOut ? 'disabled' : ''} onclick="changeQty('${prod.id}', 1)">+</button>
          </div>
        </div>
      </div>`;
  }

  (function restoreCart() {
    const saved = lsGet('5k_cart_v2', {});
    Object.values(saved).forEach(it => { const info = findProductById(it.id); if (info && info.product.inStock && it.qty > 0) cart[it.id] = { id: it.id, name: info.product.name, brand: info.brand.name, qty: it.qty }; });
  })();
  setLanguage(currentLang);
</script>
</body>
</html>
